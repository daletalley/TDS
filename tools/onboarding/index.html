<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding/Offboarding Checklist Generator</title>
  <meta name="description" content="TDS Tools — Onboarding/Offboarding Checklist Generator" />
  <style>
    :root{
      --bg0:#05060a;
      --bg1:#0a0c14;
      --glass: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 15%, rgba(126,231,255,.18), transparent 60%),
        radial-gradient(900px 600px at 75% 20%, rgba(183,166,255,.18), transparent 60%),
        radial-gradient(1000px 700px at 40% 85%, rgba(124,255,178,.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }
    .wrap{
      min-height:100%;
      padding:28px 20px 60px;
      display:flex;
      flex-direction:column;
      gap:24px;
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background: var(--glass);
      color:var(--text);
      text-decoration:none;
      font-size:14px;
      transition: transform .14s ease, background .14s ease, border-color .14s ease;
    }
    .back:hover{ transform: translateY(-1px); background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.24); }

    .card{
      max-width:760px;
      border-radius:20px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      padding:24px;
      box-shadow: var(--shadow);
    }
    h1{
      margin:0 0 8px;
      font-size:28px;
      letter-spacing:-.02em;
    }
    p{ margin:0; color:var(--muted); }
    .construction{
      margin-top:16px;
      padding:14px 16px;
      border-radius:14px;
      background: rgba(0,0,0,.25);
      border:1px dashed rgba(255,255,255,.22);
      font-family:var(--mono);
      color:rgba(255,255,255,.8);
    }
    @media (max-width: 720px){
      .wrap{ padding:20px 14px 50px; }
      .top{ flex-direction:column; align-items:flex-start; }
      h1{ font-size:24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/tools/">← Back to Tools</a>
      <div style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);">Under Construction</div>
    </div>

    <div class="card">
      <h1>Onboarding/Offboarding Checklist Generator</h1>
      <p>This tool is warming up its engines. Coming soon.</p>
      <div class="construction">// STATUS: building quietly · coffee level: critical</div>
    </div>
  </div>
</body>
</html>
