<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exporter | Talley Digital Studio</title>
  <meta name="description" content="Exporter by Talley Digital Studio. Local data handoff tool for clean CSV, JSON, TSV, and Markdown exports.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared.css?v=20260614c">
  <link rel="stylesheet" href="exporter.css?v=20260614b">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="top-left">
        <a class="back" href="/#work">← Talley Digital Studio</a>
        <div class="brand-wrap">
          <h1>Exporter</h1>
          <p>Local data handoff</p>
        </div>
      </div>
      <time class="release-stamp" datetime="2026-06-16T17:02:36-04:00">rel 2026-06-16 17:02 EDT</time>
      <div class="top-actions">
        <div class="nav-stats" aria-label="Data stats">
          <span><strong id="rowCount">0</strong> rows</span>
          <span><strong id="fieldCount">0</strong> fields</span>
        </div>
        <label class="file-btn">
          <input id="fileInput" type="file" accept=".csv,.tsv,.json,.md,.markdown,.txt,application/json,text/csv,text/tab-separated-values,text/markdown">
          Import file
        </label>
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>
    </header>

    <section class="workspace" aria-label="Exporter workspace">
      <section class="panel source-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Source</p>
            <h2>Input</h2>
          </div>
          <div class="format-switch" role="group" aria-label="Input format">
            <button class="active" type="button" data-format="auto">Auto</button>
            <button type="button" data-format="json">JSON</button>
            <button type="button" data-format="csv">CSV</button>
            <button type="button" data-format="tsv">TSV</button>
            <button type="button" data-format="md">MD</button>
          </div>
        </div>
        <textarea id="sourceInput" spellcheck="false" placeholder='Paste JSON, CSV, TSV, or a Markdown table here. Example: [{"name":"Dale","status":"ready"}]'></textarea>
        <div class="source-actions">
          <button class="btn ghost" id="sampleBtn" type="button">Load Sample</button>
          <p id="statusText" role="status">Waiting for data.</p>
        </div>
      </section>

      <aside class="panel control-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Fields</p>
            <h2>Columns</h2>
          </div>
          <button class="btn compact" id="toggleFields" type="button">All</button>
        </div>
        <div class="field-list" id="fieldList">
          <div class="empty">Paste data to choose fields.</div>
        </div>
      </aside>

      <section class="panel output-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Output</p>
            <h2>Handoff</h2>
          </div>
          <div class="format-switch" role="group" aria-label="Output format">
            <button class="active" type="button" data-output="csv">CSV</button>
            <button type="button" data-output="json">JSON</button>
            <button type="button" data-output="tsv">TSV</button>
            <button type="button" data-output="md">MD</button>
          </div>
        </div>
        <div class="handoff-bar">
          <label>
            <span>Filename</span>
            <input id="filenameInput" value="tds-export">
          </label>
          <button class="btn primary" id="copyBtn" type="button">Copy</button>
          <button class="btn open" id="downloadBtn" type="button">Download</button>
        </div>
        <pre id="outputPreview" tabindex="0">No export yet.</pre>
      </section>

      <section class="panel preview-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Preview</p>
            <h2>Rows</h2>
          </div>
          <span class="mini" id="previewCount">0 shown</span>
        </div>
        <div class="table-wrap" id="tableWrap">
          <div class="empty">Parsed rows will show here.</div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="exporter.js?v=20260614f" defer></script>
</body>
</html>
