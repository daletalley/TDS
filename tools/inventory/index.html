<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | Talley Digital Studio</title>
  <meta name="description" content="Inventory by Talley Digital Studio. Local-first stock control for simple item tracking.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared.css?v=20260616a">
  <link rel="stylesheet" href="inventory.css?v=20260625c">
  <script src="../../tds-storage.js?v=20260616a" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="top-left">
        <a class="back" href="../../index.html#work">← Talley Digital Studio</a>
        <div class="brand-wrap">
          <h1>Inventory</h1>
          <p>Local stock control</p>
          <time class="release-stamp" datetime="2026-06-25T12:39:00-05:00" title="Saved on this device. Clearing browser site data can remove it.">rel 2026-06-25 12:39 CDT</time>
        </div>
      </div>
       <div class="top-actions">
         <div class="nav-stats" aria-label="Inventory stats">
           <span><strong id="itemCount">0</strong> items</span>
           <span><strong id="lowCount">0</strong> low</span>
           <span><strong id="unitCount">0</strong> units</span>
           <span><strong id="valueCount">$0</strong> value</span>
         </div>
         <button class="btn" id="exportBtn" type="button">Export</button>
         <button class="btn" id="clearBtn" type="button">Clear</button>
         <label class="file-btn">
           <input id="importInput" type="file" accept=".json,application/json">
           Import
         </label>
       </div>
    </header>

    <section class="workspace" aria-label="Inventory workspace">
      <aside class="panel form-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Item</p>
            <h2 id="formTitle">Add stock</h2>
          </div>
          <button class="btn compact" id="resetForm" type="button">Reset</button>
        </div>
        <form id="itemForm" class="item-form">
          <label class="span-2">
            <span>Name</span>
            <input id="nameInput" required maxlength="80" autocomplete="off" placeholder="Shop towels">
          </label>
          <label>
            <span>SKU</span>
            <input id="skuInput" maxlength="40" autocomplete="off" placeholder="TOWEL-12PK">
          </label>
          <label>
            <span>Supplier</span>
            <input id="supplierInput" maxlength="60" autocomplete="off" placeholder="Grainger">
          </label>
          <label>
            <span>Category</span>
            <input id="categoryInput" maxlength="40" autocomplete="off" placeholder="Supplies" list="categoryOptions">
          </label>
          <label>
            <span>Location</span>
            <input id="locationInput" maxlength="40" autocomplete="off" placeholder="Shelf A" list="locationOptions">
          </label>
          <label>
            <span>Quantity</span>
            <input id="quantityInput" required type="number" min="0" step="1" inputmode="numeric" value="0">
          </label>
          <label>
            <span>Minimum</span>
            <input id="minimumInput" type="number" min="0" step="1" inputmode="numeric" value="0">
          </label>
          <label>
            <span>Unit</span>
            <input id="unitInput" maxlength="24" autocomplete="off" placeholder="box, pack, each" list="unitOptions">
          </label>
          <label>
            <span>Unit cost</span>
            <input id="costInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </label>
          <label class="span-2">
            <span>Note</span>
            <textarea id="noteInput" rows="4" maxlength="240" placeholder="Vendor, size, reorder note"></textarea>
          </label>
          <button class="btn primary span-2" type="submit">Save item</button>
          <p id="formStatus" class="form-status" role="status"></p>
        </form>
        <datalist id="categoryOptions"></datalist>
        <datalist id="locationOptions"></datalist>
        <datalist id="unitOptions">
          <option value="each"></option>
          <option value="box"></option>
          <option value="pack"></option>
          <option value="case"></option>
          <option value="roll"></option>
        </datalist>
      </aside>

      <section class="panel list-panel">
        <div class="toolbar">
          <label class="search">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Name, SKU, note">
          </label>
          <label>
            <span>Status</span>
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="needs">Needs reorder</option>
              <option value="out">Out</option>
              <option value="low">Low</option>
              <option value="ok">OK</option>
              <option value="untracked">No minimum</option>
            </select>
          </label>
          <label>
            <span>Category</span>
            <select id="categoryFilter">
              <option value="">All categories</option>
            </select>
          </label>
          <label>
            <span>Location</span>
            <select id="locationFilter">
              <option value="">All locations</option>
            </select>
          </label>
          <label>
            <span>Sort</span>
            <select id="sortSelect">
              <option value="updated">Recently updated</option>
              <option value="name">Name A-Z</option>
              <option value="quantity">Quantity low-high</option>
              <option value="reorder">Reorder need</option>
              <option value="value">Value high-low</option>
            </select>
          </label>
          <button class="btn ghost" id="resetFilters" type="button">Reset filters</button>
          <button class="btn ghost" id="sampleBtn" type="button">Load sample</button>
        </div>

        <div class="list-summary" id="listSummary" aria-live="polite"></div>
        <div class="inventory-list" id="tableWrap">
          <div class="empty">No items yet. Add one clean item and build from there.</div>
        </div>
      </section>
    </section>
  </main>

  <div class="confirm" id="confirmModal" aria-hidden="true">
    <div class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <p class="eyebrow">Confirm</p>
      <h2 id="confirmTitle">Delete item?</h2>
      <p>This removes the item from this browser.</p>
      <div>
        <button class="btn" type="button" data-confirm="cancel">Cancel</button>
        <button class="btn danger" type="button" data-confirm="delete">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="inventory.js?v=20260625b" defer></script>
</body>
</html>
