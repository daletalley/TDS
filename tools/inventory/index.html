<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | Talley Digital Studio</title>
  <meta name="description" content="Inventory by Talley Digital Studio. Local-first stock control for simple item tracking.">
  <link rel="stylesheet" href="../../shared.css?v=20260614c">
  <link rel="stylesheet" href="inventory.css?v=20260614a">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="top-left">
        <a class="back" href="/#work">← Talley Digital Studio</a>
        <div class="brand-wrap">
          <h1>Inventory</h1>
          <p>Local stock control</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="nav-stats" aria-label="Inventory stats">
          <span><strong id="itemCount">0</strong> items</span>
          <span><strong id="lowCount">0</strong> low</span>
          <span><strong id="valueCount">$0</strong> value</span>
        </div>
        <button class="btn" id="exportBtn" type="button">Export</button>
        <label class="file-btn">
          <input id="importInput" type="file" accept=".json,application/json">
          Import
        </label>
      </div>
    </header>

    <section class="workspace" aria-label="Inventory workspace">
      <aside class="panel form-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Item</p>
            <h2 id="formTitle">Add stock</h2>
          </div>
          <button class="btn compact" id="resetForm" type="button">Reset</button>
        </div>
        <form id="itemForm" class="item-form">
          <label class="span-2">
            <span>Name</span>
            <input id="nameInput" required maxlength="80" autocomplete="off" placeholder="Shop towels">
          </label>
          <label>
            <span>Category</span>
            <input id="categoryInput" maxlength="40" autocomplete="off" placeholder="Supplies">
          </label>
          <label>
            <span>Location</span>
            <input id="locationInput" maxlength="40" autocomplete="off" placeholder="Shelf A">
          </label>
          <label>
            <span>Quantity</span>
            <input id="quantityInput" required type="number" min="0" step="1" inputmode="numeric" value="0">
          </label>
          <label>
            <span>Minimum</span>
            <input id="minimumInput" type="number" min="0" step="1" inputmode="numeric" value="0">
          </label>
          <label>
            <span>Unit</span>
            <input id="unitInput" maxlength="24" autocomplete="off" placeholder="box, pack, each">
          </label>
          <label>
            <span>Unit cost</span>
            <input id="costInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </label>
          <label class="span-2">
            <span>Note</span>
            <textarea id="noteInput" rows="4" maxlength="240" placeholder="Vendor, size, reorder note"></textarea>
          </label>
          <button class="btn primary span-2" type="submit">Save item</button>
          <p id="formStatus" class="form-status" role="status"></p>
        </form>
      </aside>

      <section class="panel list-panel">
        <div class="toolbar">
          <label class="search">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Item, category, location, note">
          </label>
          <label>
            <span>Status</span>
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="low">Low only</option>
              <option value="ok">OK only</option>
            </select>
          </label>
          <label>
            <span>Sort</span>
            <select id="sortSelect">
              <option value="updated">Recently updated</option>
              <option value="name">Name A-Z</option>
              <option value="quantity">Quantity low-high</option>
              <option value="value">Value high-low</option>
            </select>
          </label>
          <button class="btn ghost" id="sampleBtn" type="button">Load sample</button>
        </div>

        <div class="table-wrap" id="tableWrap">
          <div class="empty">No items yet. Add one clean item and build from there.</div>
        </div>
      </section>
    </section>
  </main>

  <div class="confirm" id="confirmModal" aria-hidden="true">
    <div class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <p class="eyebrow">Confirm</p>
      <h2 id="confirmTitle">Delete item?</h2>
      <p>This removes the item from this browser.</p>
      <div>
        <button class="btn" type="button" data-confirm="cancel">Cancel</button>
        <button class="btn danger" type="button" data-confirm="delete">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="inventory.js?v=20260614a" defer></script>
</body>
</html>
