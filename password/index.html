<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Generator</title>
  <meta name="description" content="Talley Digital Studio — Password Generator" />
  <style>
    :root{
      --bg:#0b0f16;
      --panel: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.6);
      --shadow: 0 18px 48px rgba(0,0,0,.4);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 15%, rgba(126,231,255,.16), transparent 60%),
        radial-gradient(900px 600px at 75% 20%, rgba(183,166,255,.16), transparent 60%),
        linear-gradient(180deg, #0a0e15, #070a11);
    }

    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .top{
      position:sticky;
      top:0;
      z-index:10;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background: rgba(8,11,17,.72);
      border-bottom:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background: var(--panel);
      color:var(--text);
      text-decoration:none;
      font-size:14px;
      transition: transform .14s ease, background .14s ease, border-color .14s ease;
    }
    .back:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.2);
    }

    .title{
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .frame-wrap{
      flex:1;
      padding:16px;
    }

    .frame{
      width:100%;
      height:100%;
      border:1px solid var(--stroke);
      border-radius:16px;
      background: rgba(0,0,0,.25);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      background:#0b0f16;
    }

    .fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      text-align:center;
      padding:24px;
      pointer-events:none;
    }
    .fallback a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:9px 13px;
      border:1px solid var(--stroke);
      border-radius:999px;
      background:var(--panel);
      color:var(--text);
      text-decoration:none;
      font-weight:600;
      pointer-events:auto;
    }

    @media (max-width: 720px){
      .top{ flex-direction:column; align-items:flex-start; }
      .frame-wrap{ padding:12px; }
      .frame{ border-radius:12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/#work">← Back to Work</a>
      <div class="title">Password Generator</div>
    </div>

    <div class="frame-wrap">
      <div class="frame">
        <div class="fallback">
          <div>Loading password generator…</div>
          <a href="https://daletalley.github.io/password-gen/" target="_blank" rel="noreferrer">Open in new tab</a>
        </div>
        <iframe title="Password Generator" src="https://daletalley.github.io/password-gen/" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
