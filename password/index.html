<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Generator</title>
  <meta name="description" content="Talley Digital Studio — Password Generator" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../shared.css?v=20260616a" />
  <style>
    :root{
      --panel:rgba(244,241,234,.88);
      --panel-soft:rgba(255,255,255,.28);
      --stroke:var(--tds-line);
      --frame:var(--tds-ink);
      --text:var(--tds-ink);
      --muted:var(--tds-muted);
      --accent:var(--tds-accent);
      --accent-soft:var(--tds-accent-soft);
      --shadow:var(--tds-shadow);
      --sans:var(--tds-font);
    }

    @media (prefers-color-scheme:dark){
      :root{
        --panel:rgba(29,28,24,.94);
        --panel-soft:rgba(244,241,234,.1);
        --frame:rgba(244,241,234,.46);
      }
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:var(--tds-grid-bg);
      background-size:var(--tds-grid-size);
      background-attachment:fixed;
    }

    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .top{
      position:sticky;
      top:0;
      z-index:10;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:var(--panel);
      border-bottom:1px solid var(--frame);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:var(--shadow);
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:var(--panel-soft);
      color:var(--text);
      text-decoration:none;
      font-weight:900;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.02em;
      transition: transform .14s ease, background .14s ease, border-color .14s ease;
    }
    .back:hover{
      transform: translateY(-1px);
      background:var(--accent-soft);
      border-color:var(--accent);
      color:var(--accent);
    }

    .title{
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .title-wrap{
      display:grid;
      justify-items:end;
      gap:6px;
      min-width:0;
    }

    .frame-wrap{
      flex:1;
      padding:16px;
    }

    .frame{
      width:100%;
      height:100%;
      border:1px solid var(--frame);
      border-radius:var(--tds-radius);
      background:var(--panel);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      background:var(--tds-paper);
    }

    .fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      text-align:center;
      padding:24px;
      pointer-events:none;
    }
    .fallback a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:9px 13px;
      border:1px solid var(--stroke);
      border-radius:var(--tds-radius);
      background:var(--panel-soft);
      color:var(--text);
      text-decoration:none;
      font-weight:900;
      text-transform:uppercase;
      pointer-events:auto;
    }

    @media (max-width: 720px){
      .top{ flex-direction:column; align-items:flex-start; }
      .title-wrap{ justify-items:start; }
      .frame-wrap{ padding:12px; }
      .frame{ border-radius:12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/#work">← Back to Work</a>
      <div class="title-wrap">
        <div class="title">Password Generator</div>
        <time class="release-stamp" datetime="2026-06-16T17:02:36-04:00">rel 2026-06-16 17:02 EDT</time>
      </div>
    </div>

    <div class="frame-wrap">
      <div class="frame">
        <div class="fallback">
          <div>Loading password generator…</div>
          <a href="https://daletalley.github.io/password-gen/" target="_blank" rel="noreferrer">Open in new tab</a>
        </div>
        <iframe title="Password Generator" src="https://daletalley.github.io/password-gen/" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
