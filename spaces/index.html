<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spaces | Talley Digital Studio</title>
  <meta name="description" content="Spaces by Talley Digital Studio. Local-first workspace launcher for grouped links." />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../shared.css?v=20260616a" />
  <script src="../tds-storage.js?v=20260616a"></script>
  <style>
:root{
  --bg:var(--tds-paper);
  --panel:rgba(244,241,234,.92);
  --panel-soft:rgba(255,255,255,.42);
  --panel-strong:rgba(244,241,234,.98);
  --stroke:var(--tds-line);
  --stroke-strong:var(--tds-ink);
  --control-text:rgba(26,27,31,.75);
  --text:var(--tds-ink);
  --muted:var(--tds-muted);
  --accent:var(--tds-accent);
  --accent-strong:var(--tds-accent-strong);
  --accent-soft:var(--tds-accent-soft);
  --open:var(--tds-open);
  --open-soft:rgba(0,119,217,.11);
  --open-border:rgba(0,119,217,.44);
  --success:var(--tds-success);
  --success-soft:rgba(19,138,66,.12);
  --success-border:rgba(19,138,66,.42);
  --warning:#b96b00;
  --warning-soft:rgba(185,107,0,.12);
  --warning-border:rgba(185,107,0,.34);
  --danger:var(--tds-accent);
  --shadow:var(--tds-shadow);
  --shadow-red:var(--tds-shadow-red);
  --blur:14px;
  --r:var(--tds-radius);
  --r2:var(--tds-radius);
  --pad: 14px;
}

@media (prefers-color-scheme:dark){
  :root{
    --panel:rgba(29,28,24,.94);
    --panel-soft:rgba(244,241,234,.1);
    --panel-strong:rgba(36,34,29,.98);
    --stroke-strong:rgba(244,241,234,.46);
    --control-text:rgba(244,241,234,.74);
    --open-soft:rgba(88,170,255,.16);
    --open-border:rgba(88,170,255,.5);
    --success-soft:rgba(76,196,118,.15);
    --success-border:rgba(76,196,118,.5);
    --warning:#ffb35c;
    --warning-soft:rgba(255,179,92,.14);
    --warning-border:rgba(255,179,92,.4);
  }
}

html,body{height:100%}
body{
  color:var(--text);
  overflow:hidden;
  min-width:320px;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:clamp(12px,2vw,22px);
  width:min(1720px,100%);
  margin:0 auto;
}

.site-banner{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  min-height:38px;
  padding:7px 11px;
  border-radius: 999px;
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  font-size:12px;
  color:var(--muted);
  width: fit-content;
}
.site-banner a{
  color:var(--text);
  text-decoration:none;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:38px;
}
.site-banner a:hover{
  color:var(--accent);
}

.topbar{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-radius: var(--r);
  background: var(--panel);
  border:1px solid var(--stroke-strong);
  backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width: 220px;
}
.orb{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--panel);
  border:1px solid var(--stroke-strong);
  box-shadow:3px 3px 0 rgba(215,25,32,.14);
  position:relative;
}
.orb:after{
  content:"";
  position:absolute;
  inset:10px 7px;
  border-bottom:4px solid var(--accent);
  transform:skewX(-18deg);
}
.brand h1{
  font-size:18px;
  margin:0;
  letter-spacing:0;
  font-weight:900;
  text-transform:uppercase;
}
.brand p{
  font-size:12px;
  color:var(--muted);
  margin:3px 0 0;
}

.search{
  flex:1 1 260px;
  min-width:min(100%,220px);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius: var(--r);
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.search:focus-within{
  background:var(--panel-strong);
  border-color:rgba(215,25,32,.48);
  box-shadow:0 0 0 3px rgba(215,25,32,.1);
}
.search input{
  width:100%;
  background:transparent;
  border:0;
  outline:none;
  color:var(--text);
  font-size:14px;
  font-family:inherit;
}
.search .hint{font-size:12px; color:var(--muted); white-space:nowrap}
.searchIcon{
  width:14px;
  height:14px;
  border:2px solid var(--muted);
  border-radius:50%;
  position:relative;
  flex:0 0 auto;
  opacity:.72;
  font-size:0;
}
.searchIcon:after{
  content:"";
  position:absolute;
  width:6px;
  height:2px;
  right:-5px;
  bottom:-3px;
  background:var(--muted);
  transform:rotate(45deg);
  border-radius:999px;
}

.btns{display:flex; gap:10px; align-items:center}
button{
  cursor:pointer;
  border:1px solid var(--stroke);
  background: var(--panel-soft);
  color:var(--text);
  padding:10px 12px;
  border-radius: var(--r);
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:38px;
  white-space:nowrap;
  transition: transform .22s cubic-bezier(.16,1,.3,1), background .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
  box-shadow:none;
}
button:hover{
  background: var(--accent-soft);
  border-color: var(--accent);
  color:var(--accent);
}
button:active{transform: translateY(1px)}
button:focus-visible{
  outline: 2px solid rgba(215,25,32,.38);
  outline-offset: 2px;
}
button:disabled{
  cursor:not-allowed;
  opacity:0.6;
  box-shadow:none;
}

.primary{
  border-color: rgba(215,25,32,.44);
  background: rgba(215,25,32,.1);
  color:var(--accent);
}
.primary:hover{background: rgba(215,25,32,.14)}
.success{
  border-color: var(--success-border);
  background: var(--success-soft);
  color: var(--success);
}
.success:hover{
  border-color: var(--success);
  background: rgba(19,138,66,.17);
  color: var(--success);
}
.warning{
  border-color:var(--warning-border);
  background:var(--warning-soft);
  color:var(--warning);
}
.warning:hover{
  border-color:var(--warning);
  background:var(--warning-soft);
  color:var(--warning);
}
.openAction{
  border-color: var(--open-border);
  background: var(--open-soft);
  color: var(--open);
}
.openAction:hover{
  border-color: var(--open);
  background: rgba(0,119,217,.16);
  color: var(--open);
}
.danger{
  border-color: rgba(215,25,32,.38);
  background: rgba(215,25,32,.1);
  color:var(--accent);
}
.ghost{
  background: transparent;
  box-shadow:none;
}

.content{
  flex:1;
  display:grid;
  grid-template-columns: minmax(290px,340px) minmax(0,1fr);
  gap:14px;
  min-height:0;
}

.panel{
  background: var(--panel);
  border:1px solid var(--stroke-strong);
  border-radius: var(--r);
  backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow);
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.panelHeader{
  padding:13px 14px 12px;
  border-bottom: 1px solid var(--stroke-strong);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.panelHeader h2{margin:0; font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--text); font-weight:900}
.panelHeader .mini{color:var(--muted); font-size:12px}
.panelActions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  min-width:0;
}
.panelActions button{
  padding:8px 10px;
  font-size:12px;
}

.scroll{
  overflow:auto;
  padding:12px;
  min-height:0;
}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background: rgba(26,27,31,.15); border-radius: 999px}
.scroll::-webkit-scrollbar-track{background: transparent}

.folder{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px;
  border-radius: var(--r2);
  border:1px solid var(--stroke);
  background: var(--panel-soft);
  margin-bottom:9px;
  user-select:none;
  overflow:hidden;
  transition:transform .28s cubic-bezier(.16,1,.3,1),border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.folder:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:0;
  background:var(--accent);
  transition:width .22s ease;
}
.folder:hover{
  transform:translateY(-1px);
  border-color:var(--stroke-strong);
  background:var(--panel-strong);
}
.folder[data-active="true"]{
  background: rgba(215,25,32,.075);
  border-color: rgba(215,25,32,.55);
  box-shadow:var(--shadow-red);
}
.folder[data-active="true"]:before{
  width:4px;
}
.folderLeft{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  position:relative;
  z-index:1;
}
.emoji{
  width:34px;
  height:34px;
  border-radius: 8px;
  display:grid;
  place-items:center;
  background: var(--panel-strong);
  border:1px solid var(--stroke);
  flex: 0 0 auto;
  font-size:16px;
}
.folderText{min-width:0}
.folderName{
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0;
  font-weight:900;
}
.folderMeta{font-size:12px; color:var(--muted); margin-top:2px}
.folderActions{display:flex; gap:8px; align-items:center; flex:0 0 auto; position:relative; z-index:1}
.iconBtn{min-height:38px; padding:9px 10px; border-radius: var(--r); font-size:11px}

.dragHint{font-size:11px; color:var(--muted); padding:10px 14px 0; text-transform:uppercase; letter-spacing:.04em}

.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
  padding:12px 14px;
  border-bottom: 1px solid var(--stroke-strong);
  flex-wrap:wrap;
  background:var(--panel-soft);
}
.toolbar .search{
  flex:0 1 240px;
  max-width:240px;
  min-width:190px;
}
.toolbarSpacer{flex:1}
.toolbar button{
  padding:8px 9px;
  font-size:12px;
}
.selectControl{
  width:auto;
  min-width:136px;
  min-height:38px;
  padding:8px 32px 8px 10px;
  background:var(--panel-soft);
  color:var(--text);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.searchClear{
  min-height:28px;
  padding:5px 8px;
  font-size:11px;
  border-radius:6px;
}
.pill{
  display:flex;
  align-items:center;
  gap:8px;
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  padding:8px 10px;
  border-radius: var(--r);
  font-size:12px;
  color:var(--muted);
  min-height:38px;
}
.pill strong{color:var(--text); font-weight:900}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap:12px;
}

.card{
  border-radius: var(--r);
  background: var(--panel);
  border:1px solid var(--stroke);
  padding:13px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:154px;
  position:relative;
  user-select:none;
  overflow:hidden;
  transition:transform .32s cubic-bezier(.16,1,.3,1),border-color .2s ease,box-shadow .2s ease,background .2s ease;
}
.card:after{
  content:"";
  position:absolute;
  right:13px;
  top:13px;
  width:18px;
  height:3px;
  background:var(--accent);
  opacity:.9;
  pointer-events:none;
}
.card:hover{
  transform:translateY(-2px);
  border-color:var(--stroke-strong);
  background:var(--panel-strong);
  box-shadow:var(--shadow-red);
}
.card[data-drag="true"]{
  outline: 2px solid rgba(215,25,32,.55);
  outline-offset: 2px;
}
.card[data-captured="true"]{
  border-color:rgba(215,25,32,.75);
  box-shadow:0 0 0 3px rgba(215,25,32,.12), var(--shadow-red);
}
.card[data-pinned="true"]{
  border-color:var(--warning-border);
  background:linear-gradient(180deg,var(--warning-soft),transparent 70%),var(--panel);
}
.card[draggable="true"],
.folder[draggable="true"]{
  cursor:grab;
}
.card[data-drop-target="true"],
.folder[data-drop-target="true"]{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(215,25,32,.12),var(--shadow-red);
}
.cardTop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.titleRow{
  display:flex;
  align-items:flex-start;
  gap:8px;
  min-width:0;
}
.title{margin:0; font-size:15px; line-height:1.15; word-break:break-word; text-transform:uppercase; letter-spacing:0}
.title{font-weight:900}
.url{color:var(--muted); font-size:12px; word-break:break-all; margin:4px 0 0}
.pinMark{
  flex:0 0 auto;
  width:18px;
  height:18px;
  border-radius:999px;
  border:1px solid var(--warning-border);
  background:var(--warning-soft);
  color:var(--warning);
  display:grid;
  place-items:center;
  font-size:0;
  line-height:1;
  font-weight:900;
}
.pinMark:before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 6px 0 -2px currentColor;
}
.pinMark:after{
  content:"";
  width:1px;
  height:7px;
  background:currentColor;
  transform:translateY(2px);
}
.pinMark[hidden]{display:none}
.note{
  margin:0;
  color:var(--control-text);
  font-size:12px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.tag{
  font-size:11px;
  color:var(--control-text);
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  padding:6px 8px;
  border-radius: 999px;
  align-self:flex-start;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cardMeta{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}
.cardActions{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
.cardActions button{padding:8px 10px; font-size:12px; flex:1 1 auto}

.empty{
  padding:22px 14px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  border:1px dashed var(--stroke);
  border-radius:var(--r);
  background:var(--panel-soft);
  display:grid;
  gap:12px;
}
.empty strong{
  color:var(--text);
}
.emptyTitle{
  color:var(--text);
  font-size:15px;
  font-weight:900;
  text-transform:uppercase;
  margin:0;
}
.emptyCopy{
  margin:0;
}
.emptyActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.kbd{
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:11px;
  padding:2px 6px;
  border-radius: 6px;
  border:1px solid var(--stroke);
  background: var(--panel-soft);
  color:var(--control-text);
}

.modalBg{
  position:fixed;
  inset:0;
  background: rgba(16,18,20,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:50;
}
.modalBg[data-open="true"]{display:flex}
.modal{
  width:min(720px, 100%);
  max-height:calc(100vh - 32px);
  border-radius: var(--r);
  background: var(--panel-strong);
  border:1px solid var(--stroke);
  backdrop-filter: blur(18px);
  box-shadow: 0 30px 120px rgba(0,0,0,.25);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modalHead{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--stroke);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.modalHead h3{margin:0; font-size:14px}
.modalBody{padding:14px; overflow:auto}
.form{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px;
}
.form .full{grid-column: 1 / -1}
label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:0 0 6px;
}
input, textarea, select{
  width:100%;
  border-radius: var(--r);
  border:1px solid var(--stroke);
  background: var(--panel);
  color: var(--text);
  padding:10px 11px;
  outline:none;
  font-size:13px;
  font-family:inherit;
}
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  border-color: rgba(215,25,32,.58);
  box-shadow: 0 0 0 3px rgba(215,25,32,.13),1px 0 rgba(17,17,17,.16);
}
textarea{min-height:92px; resize:vertical}
.checkboxLine{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--text);
  font-size:13px;
  margin:0;
}
.checkboxLine input{
  width:auto;
  min-width:16px;
}
.storageStatus{
  border:1px solid var(--stroke);
  border-radius:var(--r);
  padding:10px;
  background:var(--panel-soft);
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}
.tabImport{
  border:1px solid var(--stroke);
  border-radius:var(--r);
  background:var(--panel-soft);
  padding:11px;
  display:grid;
  gap:10px;
}
.tabImportHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.tabImportHead label{margin-bottom:3px}
.tabImportCopy{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
}
.tabImportHead button{
  padding:8px 10px;
  font-size:11px;
  flex:0 0 auto;
}
.captureSteps{
  margin:0;
  padding-left:18px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
[hidden]{display:none !important}
.modalFoot{
  padding:12px 14px 14px;
  border-top:1px solid var(--stroke);
  display:flex;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
}
.hr{height:1px; background: var(--stroke); margin:12px 0}
.tiny{font-size:12px; color:var(--muted); line-height:1.4}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background: rgba(17,24,39,0.92);
  color: #fff;
  padding:10px 14px;
  border-radius: var(--r);
  font-size:12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  opacity:0;
  transform: translateY(8px);
  pointer-events:none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast[data-show="true"]{
  opacity:1;
  transform: translateY(0);
}

.paletteBg{
  position:fixed;
  inset:0;
  z-index:55;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:9vh 16px 16px;
  background:rgba(17,17,17,.2);
  backdrop-filter:blur(6px);
}
.paletteBg[data-open="true"]{display:flex}
.palette{
  width:min(680px,100%);
  border:1px solid var(--stroke-strong);
  border-radius:var(--r);
  background:var(--panel-strong);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.palette input{
  border:0;
  border-bottom:1px solid var(--stroke);
  border-radius:0;
  background:transparent;
  font-size:18px;
  padding:16px;
}
.paletteResults{
  max-height:min(52vh,420px);
  overflow:auto;
  padding:8px;
}
.paletteItem{
  width:100%;
  display:grid;
  grid-template-columns:72px minmax(0,1fr) minmax(110px,180px);
  gap:12px;
  align-items:center;
  text-align:left;
  border-color:transparent;
  background:transparent;
  padding:11px 10px;
}
.paletteItem:hover,
.paletteItem:focus-visible,
.paletteItem[data-active="true"]{
  border-color:var(--stroke);
  background:var(--panel-soft);
  color:var(--text);
}
.paletteItem span:first-child{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.paletteItem strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.paletteItem em{
  color:var(--muted);
  font-style:normal;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.openQueue{
  position:fixed;
  right:18px;
  bottom:72px;
  z-index:45;
  width:min(360px,calc(100vw - 36px));
  border:1px solid var(--stroke-strong);
  border-radius:var(--r);
  background:var(--panel-strong);
  box-shadow:var(--shadow);
  padding:12px;
  display:none;
}
.openQueue[data-open="true"]{display:block}
.openQueue strong{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.queueItem{
  display:grid;
  grid-template-columns:12px minmax(0,1fr);
  gap:8px;
  align-items:center;
  color:var(--muted);
  font-size:12px;
  padding:6px 0;
  border-top:1px solid var(--stroke);
}
.queueItem:first-of-type{border-top:0}
.queueDot{
  width:8px;
  height:8px;
  border-radius:50%;
  border:1px solid var(--stroke-strong);
  background:var(--panel);
}
.queueItem[data-state="open"] .queueDot{background:var(--open); border-color:var(--open)}
.queueItem[data-state="blocked"] .queueDot{background:var(--accent); border-color:var(--accent)}

.noscript{
  position:fixed;
  inset:18px auto auto 18px;
  background: #111827;
  color:#fff;
  padding:12px 14px;
  border-radius: var(--r);
  font-size:12px;
  z-index:60;
}

@media (max-width: 1100px){
  .content{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
}
@media (max-width: 860px){
  body{overflow:auto}
  .app{overflow:auto}
  .content{grid-template-columns: 1fr;}
  .brand{min-width:auto}
  .grid{grid-template-columns: 1fr;}
  .topbar{flex-direction:column; align-items:stretch}
  .btns{justify-content:stretch}
  .btns button{flex:1}
  .toolbar .search{max-width:none}

  .selectControl{width:100%}
  .pill{flex:1 1 auto}
}

  <div class="app">
    <div class="site-banner">

    </div>
    <header class="topbar">
      <div class="brand">
        <div class="orb"></div>
        <div>
          <h1>Spaces</h1>
          <p>Local workspace launcher</p>
          <time class="release-stamp" datetime="2026-06-25T12:23:57-05:00" title="Saved on this device. Clearing browser site data can remove it.">rel 2026-06-25 12:23 CDT</time>
        </div>
      </div>

      <div class="btns">
        <button id="btnPalette" class="ghost" type="button">Command</button>
        <button id="btnIO" class="ghost" type="button">Import / Export</button>
        <button id="btnSettings" class="ghost" type="button">Settings</button>
      </div>
    </header>

    <div class="content">
      <section class="panel" aria-label="Spaces">
        <div class="panelHeader">
          <h2>Spaces</h2>
          <div class="panelActions">
            <div class="mini"><span id="folderCount">0</span></div>
            <button id="btnNewFolder" class="success" type="button">New space</button>
          </div>

      <section class="panel" aria-label="Links">
        <div class="toolbar">
          <div class="pill">
            Active: <strong id="activeFolderName">—</strong>
          </div>
          <div class="pill">
            Links: <strong id="activeFolderLinks">0</strong>
          </div>
          <div class="search" title="Search links in the current space">
            <span class="searchIcon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="text" placeholder="Search links…" aria-label="Search links" />
            <button id="btnClearSearch" class="searchClear ghost" type="button" aria-label="Clear search" hidden>Clear</button>
            <span class="hint"><span class="kbd">/</span> focus</span>

            <option value="manual">Custom order</option>
            <option value="pinned">Pinned first</option>
            <option value="alpha">A to Z</option>
            <option value="recent">Recently opened</option>
            <option value="domain">Domain</option>
          </select>
          <div class="toolbarSpacer"></div>
          <button id="btnAddTabs" class="openAction" type="button" hidden>Add from tabs</button>
          <button id="btnCapture" class="ghost" type="button">Capture</button>
          <button id="btnBulkAdd" class="ghost" type="button">Add list</button>
          <button id="btnNewLink" class="success" type="button">New link</button>
          <button id="btnOpenAll" class="openAction" type="button" title="Open all links in this space">Open all</button>
        </div>
        <div id="itemsWrap" class="scroll">

      <div id="paletteResults" class="paletteResults" role="listbox"></div>

  <div id="modalBg" class="modalBg" data-open="false" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <button id="modalClose" class="ghost" type="button">Close</button>
      </div>

    </div>
  </div>

  <noscript>
    <div class="noscript">Spaces needs JavaScript enabled to work.</div>
  </noscript>

  <script>
(() => {
  "use strict";

  const LS_KEY = "spaces_v1";
  const BACKUP_KEY = "spaces_import_backup_v1";
  const LEGACY_KEYS = ["workspace_switcher_v1"];
  const SORT_MODES = new Set(["manual", "pinned", "alpha", "recent", "domain"]);
  const now = () => Date.now();

  const defaultSettings = {
    openMode: "tabs",
    confirmOpenAll: true,
    maxOpenAll: 24,
    openDelayMs: 80,
    sortMode: "manual"
  };

  const el = {
    folderList: document.getElementById("folderList"),
    folderCount: document.getElementById("folderCount"),
    activeFolderName: document.getElementById("activeFolderName"),
    activeFolderLinks: document.getElementById("activeFolderLinks"),
    itemsGrid: document.getElementById("itemsGrid"),
    emptyState: document.getElementById("emptyState"),
    searchInput: document.getElementById("searchInput"),
    btnNewFolder: document.getElementById("btnNewFolder"),
    btnPalette: document.getElementById("btnPalette"),
    btnAddTabs: document.getElementById("btnAddTabs"),
    btnCapture: document.getElementById("btnCapture"),
    btnBulkAdd: document.getElementById("btnBulkAdd"),
    btnNewLink: document.getElementById("btnNewLink"),
    btnIO: document.getElementById("btnIO"),
    btnSettings: document.getElementById("btnSettings"),
    btnOpenAll: document.getElementById("btnOpenAll"),
    btnClearSearch: document.getElementById("btnClearSearch"),
    sortMode: document.getElementById("sortMode"),
    toast: document.getElementById("toast"),
    openQueue: document.getElementById("openQueue"),
    paletteBg: document.getElementById("paletteBg"),
    paletteInput: document.getElementById("paletteInput"),
    paletteResults: document.getElementById("paletteResults"),

    modalBg: document.getElementById("modalBg"),
    modalTitle: document.getElementById("modalTitle"),
    modalBody: document.getElementById("modalBody"),
    modalFoot: document.getElementById("modalFoot"),
    modalClose: document.getElementById("modalClose")
  };

  let state = seedData();
  let capturedLinkId = null;
  let paletteActiveIndex = 0;
  let modalReturnFocus = null;

  function createId() {
    return crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(16).slice(2) + "-" + now());
  }

  function seedData() {
    const id = createId;
    const work = id();
    const life = id();
    const learn = id();

    return {
      version: 1,
      settings: { ...defaultSettings },
      activeFolderId: work,
      folders: [
        {
          id: work,
          name: "Work",
          emoji: "🧠",
          createdAt: now(),
          order: 0,
          links: [
            { id: id(), title: "Email", url: "https://mail.google.com/", notes: "Inbox and daily replies.", pinned: true, createdAt: now(), order: 0 },
            { id: id(), title: "Calendar", url: "https://calendar.google.com/", notes: "", pinned: false, createdAt: now(), order: 1 },
            { id: id(), title: "GitHub", url: "https://github.com/", notes: "Repos, issues, and pull requests.", pinned: false, createdAt: now(), order: 2 }
          ]
        },
        {
          id: life,
          name: "Life",
          emoji: "✨",
          createdAt: now(),
          order: 1,
          links: [
            { id: id(), title: "YouTube", url: "https://www.youtube.com/", notes: "", pinned: false, createdAt: now(), order: 0 },
            { id: id(), title: "Spotify", url: "https://open.spotify.com/", notes: "", pinned: false, createdAt: now(), order: 1 }
          ]
        },
        {
          id: learn,
          name: "Learn",
          emoji: "📚",
          createdAt: now(),
          order: 2,
          links: [
            { id: id(), title: "MDN", url: "https://developer.mozilla.org/", notes: "Web platform reference.", pinned: true, createdAt: now(), order: 0 },
            { id: id(), title: "Stack Overflow", url: "https://stackoverflow.com/", notes: "", pinned: false, createdAt: now(), order: 1 }
          ]
        }
      ]
    };
  }

  function loadLegacyState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        return normalizeState(data);
      }

      for (const key of LEGACY_KEYS) {
        const legacyRaw = localStorage.getItem(key);
        if (!legacyRaw) continue;
        const legacyData = JSON.parse(legacyRaw);
        return normalizeState(legacyData);
      }

      return seedData();
    } catch (err) {
      return seedData();
    }
  }

  async function loadState() {
    try {
      const data = await window.TDSStorage?.get(LS_KEY, loadLegacyState()) ?? loadLegacyState();
      return normalizeState(data);
    } catch (err) {
      return loadLegacyState();
    }
  }

  async function saveState({ silent = false } = {}) {
    let saved = false;
    if (window.TDSStorage) {
      saved = await window.TDSStorage.set(LS_KEY, state);
    } else {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        saved = true;
      } catch (err) {
        saved = false;
      }
    }
    if (saved === false && !silent) {
      notify("Unable to save changes on this device.");
    }
  }

  window.addEventListener("storage", (event) => {
    if (event.key !== LS_KEY || !event.newValue) return;
    try {
      state = normalizeState(JSON.parse(event.newValue));
      render();
      notify("Spaces updated from another tab.");
    } catch (err) {
      notify("Could not read updated spaces data.");
    }
  });

  function normalizeState(data) {
    if (!data || typeof data !== "object") {
      return seedData();
    }

    const settings = normalizeSettings(data.settings || {});
    const rawFolders = Array.isArray(data.folders) ? data.folders : [];
    const folders = rawFolders.map((folder, index) => normalizeFolder(folder, index)).filter(Boolean);

    ensureUniqueFolderIds(folders);
    folders.forEach((folder) => ensureUniqueLinkIds(folder));

    const activeFolderId = folders.find((f) => f.id === data.activeFolderId)?.id || (folders[0]?.id ?? null);

    const normalized = {
      version: 1,
      settings,
      activeFolderId,
      folders
    };

    normalizeOrders(normalized);
    return normalized;
  }

  function normalizeSettings(raw) {
    const openMode = raw.openMode === "window" ? "window" : "tabs";
    const confirmOpenAll = raw.confirmOpenAll === undefined ? defaultSettings.confirmOpenAll : Boolean(raw.confirmOpenAll);
    const maxOpenAll = clampInt(raw.maxOpenAll, 1, 100, defaultSettings.maxOpenAll);
    const openDelayMs = clampInt(raw.openDelayMs, 0, 2000, defaultSettings.openDelayMs);
    const sortMode = SORT_MODES.has(raw.sortMode) ? raw.sortMode : defaultSettings.sortMode;
    return { openMode, confirmOpenAll, maxOpenAll, openDelayMs, sortMode };
  }

  function normalizeFolder(raw, fallbackOrder) {
    if (!raw || typeof raw !== "object") {
      return null;
    }
    const id = typeof raw.id === "string" && raw.id ? raw.id : createId();
    const name = typeof raw.name === "string" && raw.name.trim() ? raw.name.trim() : "Untitled";
    const emoji = clipGraphemes(typeof raw.emoji === "string" ? raw.emoji.trim() : "📁", 4) || "📁";
    const createdAt = typeof raw.createdAt === "number" ? raw.createdAt : now();
    const order = typeof raw.order === "number" ? raw.order : fallbackOrder;
    const linksRaw = Array.isArray(raw.links) ? raw.links : [];
    const links = linksRaw.map((link, index) => normalizeLink(link, index)).filter(Boolean);

    return { id, name, emoji, createdAt, order, links };
  }

  function normalizeLink(raw, fallbackOrder) {
    if (!raw || typeof raw !== "object") {
      return null;
    }
    const id = typeof raw.id === "string" && raw.id ? raw.id : createId();
    const url = typeof raw.url === "string" ? safeUrl(raw.url.trim()) : null;
    if (!url) {
      return null;
    }
    const titleRaw = typeof raw.title === "string" ? raw.title.trim() : "";
    const title = titleRaw || domainOf(url) || "Untitled";
    const notes = typeof raw.notes === "string" ? raw.notes.trim().slice(0, 320) : "";
    const pinned = Boolean(raw.pinned);
    const createdAt = typeof raw.createdAt === "number" ? raw.createdAt : now();
    const lastOpened = typeof raw.lastOpened === "number" ? raw.lastOpened : 0;
    const order = typeof raw.order === "number" ? raw.order : fallbackOrder;

    return { id, title, url, notes, pinned, createdAt, lastOpened, order };
  }

  function ensureUniqueFolderIds(folders) {
    const seen = new Set();
    folders.forEach((folder) => {
      if (seen.has(folder.id)) {
        folder.id = createId();
      }
      seen.add(folder.id);
    });
  }

  function ensureUniqueLinkIds(folder) {
    const seen = new Set();
    folder.links.forEach((link) => {
      if (seen.has(link.id)) {
        link.id = createId();
      }
      seen.add(link.id);
    });
  }

  function byOrder(a, b) {
    return (a.order ?? 0) - (b.order ?? 0);
  }

  function sortLinksForView(links) {
    const mode = normalizeSettings(state.settings || {}).sortMode;
    const list = [...(links || [])].sort(byOrder);
    const pinnedFirst = (a, b) => Number(Boolean(b.pinned)) - Number(Boolean(a.pinned));

    if (mode === "pinned") {
      return list.sort((a, b) => pinnedFirst(a, b) || byOrder(a, b));
    }

    if (mode === "alpha") {
      return list.sort((a, b) => a.title.localeCompare(b.title) || byOrder(a, b));
    }

    if (mode === "recent") {
      return list.sort((a, b) => (b.lastOpened || 0) - (a.lastOpened || 0) || byOrder(a, b));
    }

    if (mode === "domain") {
      return list.sort((a, b) => domainOf(a.url).localeCompare(domainOf(b.url)) || a.title.localeCompare(b.title) || byOrder(a, b));
    }

    return list;
  }

  function canDragLinks() {
    return normalizeSettings(state.settings || {}).sortMode === "manual";
  }

  function normalizeOrders(target = state) {
    const folders = [...target.folders].sort(byOrder);
    folders.forEach((folder, index) => {
      folder.order = index;
      const links = [...(folder.links || [])].sort(byOrder);
      links.forEach((link, linkIndex) => {
        link.order = linkIndex;
      });
      folder.links = links;
    });
    target.folders = folders;
  }

  function activeFolder() {
    const match = state.folders.find((f) => f.id === state.activeFolderId);
    if (match) return match;
    return state.folders[0] || null;
  }

  function setActiveFolder(folderId) {
    if (!state.folders.some((folder) => folder.id === folderId)) return;
    state.activeFolderId = folderId;
    saveState();
    render();
  }

  function safeUrl(input) {
    if (!input) return null;
    const trimmed = input.trim();
    const hasScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(trimmed);
    const candidate = hasScheme ? trimmed : `https://${trimmed}`;
    try {
      const url = new URL(candidate);
      const allowed = ["http:", "https:", "mailto:"];
      if (!allowed.includes(url.protocol)) return null;
      return url.toString();
    } catch (err) {
      return null;
    }
  }

  function domainOf(url) {
    try {
      const parsed = new URL(url);
      if (parsed.protocol === "mailto:") return "email";
      return parsed.hostname.replace(/^www\./, "");
    } catch (err) {
      return "";
    }
  }

  function formatLastOpened(value) {
    if (!value) return "never opened";
    const diff = now() - value;
    const minute = 60 * 1000;
    const day = 24 * 60 * 60 * 1000;
    if (diff < minute) return "opened just now";
    if (diff < day) return "opened today";
    if (diff < day * 7) return `opened ${Math.max(1, Math.floor(diff / day))}d ago`;
    return `opened ${Math.max(1, Math.floor(diff / (day * 7)))}w ago`;
  }

  function spaceHealth(folder) {
    const links = folder.links || [];
    const count = links.length;
    const pinned = links.filter((link) => link.pinned).length;
    const lastOpened = links.reduce((latest, link) => Math.max(latest, link.lastOpened || 0), 0);
    const hint = count ? formatLastOpened(lastOpened) : "ready for links";
    const pinHint = pinned ? ` · ${pinned} pinned` : "";
    return `${count} link${count === 1 ? "" : "s"}${pinHint} · ${hint}`;
  }

  function tabsApi() {
    if (globalThis.browser?.tabs?.query) {
      return {
        query: (queryInfo) => globalThis.browser.tabs.query(queryInfo)
      };
    }

    if (globalThis.chrome?.tabs?.query) {
      return {
        query: (queryInfo) => new Promise((resolve, reject) => {
          globalThis.chrome.tabs.query(queryInfo, (tabs) => {
            const err = globalThis.chrome.runtime?.lastError;
            if (err) {
              reject(new Error(err.message));
              return;
            }
            resolve(tabs || []);
          });
        })
      };
    }

    return null;
  }

  async function currentWindowTabs() {
    const api = tabsApi();
    if (!api) return [];

    try {
      const tabs = await api.query({ currentWindow: true });
      return tabs
        .map((tab) => ({
          id: tab.id,
          title: typeof tab.title === "string" ? tab.title.trim() : "",
          url: safeUrl(typeof tab.url === "string" ? tab.url : "")
        }))
        .filter((tab) => tab.url);
    } catch (err) {
      return [];
    }
  }

  function tabOptionLabel(tab) {
    const title = tab.title || domainOf(tab.url) || "Untitled";
    const domain = domainOf(tab.url);
    return domain ? `${title} - ${domain}` : title;
  }

  function addLinkToFolder(folder, link) {
    const title = (link.title || "").trim() || domainOf(link.url) || "Untitled";
    const url = safeUrl(link.url);
    if (!folder || !url) return null;
    const notes = typeof link.notes === "string" ? link.notes.trim().slice(0, 320) : "";
    const pinned = Boolean(link.pinned);

    const existing = (folder.links || []).find((item) => item.url === url);
    if (existing) {
      existing.title = existing.title || title;
      if (notes && !existing.notes) existing.notes = notes;
      if (pinned) existing.pinned = true;
      return { link: existing, added: false };
    }

    const maxOrder = Math.max(-1, ...(folder.links || []).map((item) => item.order ?? 0));
    const saved = {
      id: createId(),
      title,
      url,
      notes,
      pinned,
      createdAt: now(),
      lastOpened: 0,
      order: maxOrder + 1
    };
    folder.links.push(saved);
    return { link: saved, added: true };
  }

  function folderOptions(selectedId) {
    return [...state.folders].sort(byOrder).map((folder) => (
      `<option value="${escapeHtml(folder.id)}"${folder.id === selectedId ? " selected" : ""}>${escapeHtml(folder.name)}</option>`
    )).join("");
  }

  function bookmarkletCode(folderId = "") {
    const target = `${window.location.origin}${window.location.pathname}`;
    const folderPart = folderId ? `+'&space=${encodeURIComponent(folderId)}'` : "";
    return `javascript:(()=>{const s=${JSON.stringify(target)};const u=encodeURIComponent(location.href);const t=encodeURIComponent(document.title||location.hostname||location.href);location.href=s+'?capture=1&addUrl='+u+'&addTitle='+t${folderPart};})()`;
  }

  function showCaptureSetup() {
    const folder = activeFolder();
    const code = () => bookmarkletCode(wrap.querySelector("#capture_space")?.value || folder?.id || "");
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="form">
        <div class="full">
          <label>Save captured pages to</label>
          <select id="capture_space">
            ${folderOptions(folder?.id || state.folders[0]?.id || "")}
          </select>
        </div>
        <div class="full">
          <ol class="captureSteps">
            <li>Click <b>Copy bookmarklet</b>.</li>
            <li>Create a bookmark named <b>Add to Spaces</b>.</li>
            <li>Paste it as the bookmark URL for one-click capture into the selected space.</li>
          </ol>
        </div>
      </div>
    `;

    const btnCopy = mkButton("Copy bookmarklet", {
      cls: "primary",
      onClick: async () => {
        try {
          await navigator.clipboard.writeText(code());
          notify("Bookmarklet copied.");
        } catch (err) {
          notify("Copy blocked by the browser.");
        }
      }
    });

    openModal({ title: "Capture pages", body: wrap, footer: [btnCopy] });
  }

  function clipGraphemes(value, limit) {
    return Array.from(value).slice(0, limit).join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function notify(message) {
    if (!el.toast) return;
    el.toast.textContent = message;
    el.toast.dataset.show = "true";
    window.clearTimeout(notify._timer);
    notify._timer = window.setTimeout(() => {
      el.toast.dataset.show = "false";
    }, 2200);
  }

  function isTextInput(target) {
    if (!target) return false;
    const tag = target.tagName ? target.tagName.toLowerCase() : "";
    return tag === "input" || tag === "textarea" || tag === "select" || target.isContentEditable;
  }

  function focusableWithin(root) {
    return [...root.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')]
      .filter((node) => node.offsetParent !== null);
  }

  function openModal({ title, body, footer }) {
    modalReturnFocus = document.activeElement;
    el.modalTitle.textContent = title;
    el.modalBody.innerHTML = "";
    el.modalFoot.innerHTML = "";

  el.paletteInput.addEventListener("keydown", (event) => {
    const items = [...el.paletteResults.querySelectorAll(".paletteItem")];
    if (!items.length) return;

    if (event.key === "ArrowDown") {
      event.preventDefault();
      setPaletteActive(paletteActiveIndex + 1);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      setPaletteActive(paletteActiveIndex - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      setPaletteActive(0);
    } else if (event.key === "End") {
      event.preventDefault();
      setPaletteActive(items.length - 1);
    } else if (event.key === "Enter") {
      event.preventDefault();
      items[paletteActiveIndex]?.click();
    }
  });
  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      openPalette();
      return;
    }
    if (event.key === "Tab" && el.modalBg.dataset.open === "true") {
      const items = focusableWithin(el.modalBg);
      if (!items.length) return;
      const first = items[0];
      const last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
    if (event.key === "Escape" && el.modalBg.dataset.open === "true") {
      closeModal();
    }
    if (event.key === "Escape" && el.paletteBg.dataset.open === "true") {
      closePalette();
    }
    if (event.key === "Escape" && document.activeElement === el.searchInput && el.searchInput.value) {
      el.searchInput.value = "";
      render();
    }
    if (event.key === "/" && !isTextInput(document.activeElement)) {
      event.preventDefault();
      el.searchInput.focus();
    }
  });

  function parseBulkLine(line) {
    const trimmed = line.trim();
    if (!trimmed) return null;

    const markdown = trimmed.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
    if (markdown) {
      return { title: markdown[1].trim(), url: markdown[2].trim() };
    }

    const pipeIndex = trimmed.lastIndexOf("|");
    if (pipeIndex > 0) {
      return {
        title: trimmed.slice(0, pipeIndex).trim(),
        url: trimmed.slice(pipeIndex + 1).trim()
      };
    }

    const urlMatch = trimmed.match(/((?:https?:\/\/|mailto:|www\.|[a-z0-9][a-z0-9.-]*\.[a-z]{2,})(?:[^\s]*)?)/i);
    if (!urlMatch) {
      return { title: trimmed, url: "" };
    }

    const url = urlMatch[1];
    const title = trimmed
      .replace(url, "")
      .replace(/^[\s\-:|]+|[\s\-:|]+$/g, "")
      .trim();

    return { title, url };
  }

  function handleIncomingCapture() {
    const params = new URLSearchParams(window.location.search);
    const capturedUrl = safeUrl(params.get("addUrl") || "");
    if (!capturedUrl) return;

    const captured = new URL(capturedUrl);
    const here = new URL(window.location.href);
    if (captured.origin === here.origin && captured.pathname === here.pathname) {
      const cleanSelfUrl = `${window.location.origin}${window.location.pathname}${window.location.hash}`;
      window.history.replaceState(null, "", cleanSelfUrl);
      notify("Open another page, then click the Add to Spaces bookmark.");
      return;
    }

    const title = (params.get("addTitle") || domainOf(capturedUrl) || "Untitled").trim();
    const cleanUrl = `${window.location.origin}${window.location.pathname}${window.location.hash}`;
    window.history.replaceState(null, "", cleanUrl);

    const targetFolder = state.folders.find((item) => item.id === params.get("space")) || activeFolder();
    if (!targetFolder) {
      showLinkModal(null, { title, url: capturedUrl });
      return;
    }

    const result = addLinkToFolder(targetFolder, { title, url: capturedUrl });
    if (!result) return;
    const saved = result.link;

    capturedLinkId = saved.id;
    state.activeFolderId = targetFolder.id;
    el.searchInput.value = "";
    normalizeOrders();
    saveState();
    render();
    notify(result.added ? `Captured to ${targetFolder.name}.` : `Already saved in ${targetFolder.name}.`);

    window.setTimeout(() => {
      const card = el.itemsGrid.querySelector(`[data-link-id="${CSS.escape(saved.id)}"]`);
      card?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }, 80);
  }

  async function openAllInFolder() {
    const folder = activeFolder();
    if (!folder) return;

    const links = sortLinksForView(folder.links || []).filter((link) => safeUrl(link.url));
    if (!links.length) {
      alert("No valid links in this space.");
      return;
    }

    const settings = normalizeSettings(state.settings || {});
    const cap = Math.max(1, settings.maxOpenAll || 24);
    const toOpen = links.slice(0, cap);

    if (settings.confirmOpenAll) {
      const targetName = settings.openMode === "window" ? "windows" : "tabs";
      const ok = confirm(`Open ${toOpen.length}${links.length > cap ? " (capped)" : ""} ${targetName} from "${folder.name}"?`);
      if (!ok) return;
    }

    showQueue(folder, toOpen);

    if (settings.openMode === "window") {
      let opened = 0;
      for (let index = 0; index < toOpen.length; index++) {
        const item = toOpen[index];
        const win = openWindow(item.url, index);
        if (!win && opened === 0) {
          setQueueState(item.id, "blocked");
          alert("Popup blocked. Allow popups or switch to tabs mode in Settings.");
          return;
        }
        if (win) {
          opened += 1;
          markOpened(item);
          setQueueState(item.id, "open");
        } else {
          setQueueState(item.id, "blocked");
        }
        await sleep(settings.openDelayMs ?? defaultSettings.openDelayMs);
      }
      finishQueue();
      saveState();
      render();
      return;
    }

    let opened = 0;
    for (const item of toOpen) {
      const win = window.open(item.url, "_blank", "noopener,noreferrer");
      try {
        if (win) win.opener = null;
      } catch (err) {
        // Some cross-origin windows may not allow opener cleanup.
      }
      if (!win && opened === 0) {
        setQueueState(item.id, "blocked");
        alert("Popup blocked. Allow popups or reduce open settings.");
        return;
      }
      if (win) {
        opened += 1;
        markOpened(item);
        setQueueState(item.id, "open");
      } else {
        setQueueState(item.id, "blocked");
      }
      await sleep(settings.openDelayMs ?? defaultSettings.openDelayMs);
    }
    finishQueue();
    saveState();
    render();
  }

  function openWindow(url, index) {
    const width = Math.min(1240, Math.max(760, Math.round(window.screen.availWidth * 0.72)));
    const height = Math.min(920, Math.max(560, Math.round(window.screen.availHeight * 0.78)));
    const offset = index * 28;
    const left = Math.max(0, Math.round((window.screen.availWidth - width) / 2) + offset);
    const top = Math.max(0, Math.round((window.screen.availHeight - height) / 2) + offset);
    const features = [
      "popup=yes",
      `width=${width}`,
      `height=${height}`,
      `left=${left}`,
      `top=${top}`
    ].join(",");

    const opened = window.open(url, `spaces_window_${Date.now()}_${index}`, features);
    try {
      if (opened) opened.opener = null;
    } catch (err) {
      // Some cross-origin windows may not allow opener cleanup.
    }
    return opened;
  }

  function openOne(url, link = null) {
    const safe = safeUrl(url);
    if (!safe) {
      notify("That link is not valid anymore.");
      return;
    }
    const win = window.open(safe, "_blank", "noopener,noreferrer");
    try {
      if (win) win.opener = null;
    } catch (err) {
      // Some cross-origin windows may not allow opener cleanup.
    }
    if (!win) {
      notify("Popup blocked. Allow popups for Spaces.");
      return;
    }
    if (link) {
      markOpened(link);
      saveState();
      render();
    }
  }

  function markOpened(link) {
    if (!link) return;
    link.lastOpened = now();
  }

  function showQueue(folder, links) {
    el.openQueue.dataset.open = "true";
    el.openQueue.innerHTML = `
      <strong>Opening ${escapeHtml(folder.name)}</strong>
      ${links.map((link) => `
        <div class="queueItem" data-link-id="${escapeHtml(link.id)}" data-state="queued">
          <span class="queueDot" aria-hidden="true"></span>
          <span>${escapeHtml(link.title)}</span>
        </div>
      `).join("")}
    `;
  }

  function setQueueState(linkId, stateName) {
    const item = el.openQueue.querySelector(`[data-link-id="${CSS.escape(linkId)}"]`);
    if (item) item.dataset.state = stateName;
  }

  function finishQueue() {
    window.clearTimeout(finishQueue._timer);
    finishQueue._timer = window.setTimeout(() => {
      el.openQueue.dataset.open = "false";
    }, 1800);
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function writeImportBackup() {
    const backup = {
      version: 1,
      createdAt: now(),
      state: normalizeState(JSON.parse(JSON.stringify(state)))
    };

    if (window.TDSStorage) {
      return window.TDSStorage.set(BACKUP_KEY, backup);
    }

    try {
      localStorage.setItem(BACKUP_KEY, JSON.stringify(backup));
      return true;
    } catch (err) {
      return false;
    }
  }

  async function readImportBackup() {
    try {
      const fallbackRaw = localStorage.getItem(BACKUP_KEY);
      const fallback = fallbackRaw ? JSON.parse(fallbackRaw) : null;
      return await window.TDSStorage?.get(BACKUP_KEY, fallback) ?? fallback;
    } catch (err) {
      return null;
    }
  }

  function downloadJson(filename, value) {
    const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function showImportExport() {
    const wrap = document.createElement("div");
    const backup = await readImportBackup();
    const data = JSON.stringify(state, null, 2);

    wrap.innerHTML = `
      <div class="tiny">
        Saved on this device. Clearing browser site data can remove it, so export a backup for anything important. Import replaces your current data.
      </div>
      <div class="hr"></div>
      <label>Export (copy this)</label>
      <textarea id="io_area">${escapeHtml(data)}</textarea>
      <div class="hr"></div>
      <label>Import file</label>
      <input id="io_file" type="file" accept="application/json,.json">
      <div class="hr"></div>
      <div class="tiny">
        Import: paste JSON above or choose a backup file, then click “Import”. The current data is saved as a restore point first.
      </div>
    `;

    const fileInput = wrap.querySelector("#io_file");
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      try {
        wrap.querySelector("#io_area").value = await file.text();
        notify("Backup file loaded.");
      } catch (err) {
        notify("Could not read that file.");
      }
    });

    const btnCopy = mkButton("Copy export", {
      cls: "",
      onClick: async () => {
        const area = wrap.querySelector("#io_area");
        area.select();
        try {
          await navigator.clipboard.writeText(area.value);
          notify("Export copied to clipboard.");
        } catch (err) {
          document.execCommand("copy");
          notify("Export copied.");
        }
      }
    });
    const btnDownload = mkButton("Download backup", {
      cls: "",
      onClick: () => {
        const stamp = new Date().toISOString().slice(0, 10);
        downloadJson(`spaces-backup-${stamp}.json`, state);
        notify("Backup downloaded.");
      }
    });
    const btnImport = mkButton("Import (replace)", {
      cls: "primary",
      onClick: async () => {
        const txt = wrap.querySelector("#io_area").value.trim();
        try {
          const obj = JSON.parse(txt);
          await writeImportBackup();
          state = normalizeState(obj);
          saveState();
          render();
          closeModal();
          notify("Import complete.");
        } catch (err) {
          alert("Import failed. Paste valid JSON from an export.");
        }
      }
    });
    const btnRestore = mkButton("Restore last", {
      cls: "warning",
      onClick: () => {
        if (!backup?.state) return;
        const ok = confirm("Restore the data that was saved before your last import?");
        if (!ok) return;
        state = normalizeState(backup.state);
        saveState();
        render();
        closeModal();
        notify("Restore complete.");
      }
    });
    btnRestore.disabled = !backup?.state;

    openModal({ title: "Import / Export", body: wrap, footer: [btnCopy, btnDownload, btnRestore, btnImport] });
    setTimeout(() => wrap.querySelector("#io_area").focus(), 30);
  }

  async function showSettings() {
    const settings = normalizeSettings(state.settings || {});
    const persisted = await window.TDSStorage?.persisted?.();
    const estimate = await window.TDSStorage?.estimate?.();
    const usage = estimate?.usage ? `${Math.ceil(estimate.usage / 1024)} KB used` : "Storage usage unavailable";

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="form">
        <div>
          <label>Open mode</label>
          <select id="s_mode">
            <option value="tabs">New tabs</option>
            <option value="window">Separate windows</option>
          </select>
        </div>
        <div>
          <label>Safety cap (max tabs)</label>
          <input id="s_cap" type="number" min="1" max="100" value="${settings.maxOpenAll}">
        </div>
        <div>
          <label>Open delay (ms)</label>
          <input id="s_delay" type="number" min="0" max="2000" value="${settings.openDelayMs}">
        </div>
        <label class="checkboxLine full">
          <input id="s_confirm" type="checkbox"${settings.confirmOpenAll ? " checked" : ""}>
          Confirm before opening a whole space
        </label>
        <div class="storageStatus full">
          ${persisted ? "Persistent storage is granted for this browser." : "This browser may clear local data if storage pressure is high."}
          ${escapeHtml(usage)}.
        </div>
        <div class="full tiny">
          Note: browsers may block popups if you open many links too fast or without a click.
        </div>
      </div>
    `;

    wrap.querySelector("#s_mode").value = settings.openMode;

    const btnSave = mkButton("Save settings", {
      cls: "primary",
      onClick: () => {
        const openMode = wrap.querySelector("#s_mode").value;
        const confirmOpenAll = wrap.querySelector("#s_confirm").checked;
        const maxOpenAll = clampInt(wrap.querySelector("#s_cap").value, 1, 100, defaultSettings.maxOpenAll);
        const openDelayMs = clampInt(wrap.querySelector("#s_delay").value, 0, 2000, defaultSettings.openDelayMs);

        state.settings = { ...normalizeSettings(state.settings || {}), openMode, confirmOpenAll, maxOpenAll, openDelayMs };
        saveState();
        closeModal();
        notify("Settings saved.");
      }
    });
    const btnPersist = mkButton("Keep data", {
      cls: "ghost",
      onClick: async () => {
        const ok = await window.TDSStorage?.persist?.();
        notify(ok ? "Persistent storage enabled." : "Persistent storage was not granted.");
      }
    });

    openModal({ title: "Settings", body: wrap, footer: [btnPersist, btnSave] });
  }

  function clampInt(value, min, max, fallback) {
    const number = parseInt(value, 10);
    if (Number.isNaN(number)) return fallback;
    return Math.min(max, Math.max(min, number));
  }

  let drag = { type: null, folderId: null, linkId: null };

  function onFolderDragStart(event, folderId) {
    drag = { type: "folder", folderId, linkId: null };
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", folderId);
  }

  function onFolderDrop(event, targetFolderId) {
    event.preventDefault();
    if (drag.type !== "folder" || drag.folderId === targetFolderId) return;

    const list = [...state.folders].sort(byOrder);
    const from = list.findIndex((folder) => folder.id === drag.folderId);
    const to = list.findIndex((folder) => folder.id === targetFolderId);
    if (from < 0 || to < 0) return;

    const [moved] = list.splice(from, 1);
    list.splice(to, 0, moved);
    list.forEach((folder, index) => {
      folder.order = index;
    });

    state.folders = list;
    saveState();
    render();
  }

  function onLinkDragStart(event, linkId) {
    const folder = activeFolder();
    if (!folder) return;
    drag = { type: "link", folderId: folder.id, linkId };
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", linkId);
  }

  function onLinkDrop(event, targetLinkId) {
    event.preventDefault();
    if (drag.type !== "link" || drag.linkId === targetLinkId) return;

    const folder = activeFolder();
    if (!folder || folder.id !== drag.folderId) return;

    const list = [...(folder.links || [])].sort(byOrder);
    const from = list.findIndex((link) => link.id === drag.linkId);
    const to = list.findIndex((link) => link.id === targetLinkId);
    if (from < 0 || to < 0) return;

    const [moved] = list.splice(from, 1);
    list.splice(to, 0, moved);
    list.forEach((link, index) => {
      link.order = index;
    });
    folder.links = list;

    saveState();
    render();
  }

  function setDropTarget(event, active) {
    if (event.currentTarget) {
      event.currentTarget.dataset.dropTarget = String(active);
    }
  }

  function renderEmptyState({ title, copy, actions = [] }) {
    el.emptyState.style.display = "grid";
    el.emptyState.innerHTML = `
      <p class="emptyTitle">${escapeHtml(title)}</p>
      <p class="emptyCopy">${copy}</p>
    `;

    if (actions.length) {
      const row = document.createElement("div");
      row.className = "emptyActions";
      actions.forEach((button) => row.appendChild(button));
      el.emptyState.appendChild(row);
    }
  }

  function render() {
    normalizeOrders();
    state.settings = normalizeSettings(state.settings || {});
    const settings = state.settings;

    const folders = [...state.folders].sort(byOrder);
    el.folderCount.textContent = String(folders.length);
    el.folderList.innerHTML = "";
    el.sortMode.value = settings.sortMode;
    el.btnClearSearch.hidden = !el.searchInput.value;

    folders.forEach((folder) => {
      const node = document.createElement("div");
      node.className = "folder";
      node.draggable = true;
      node.dataset.active = String(folder.id === state.activeFolderId);
      node.setAttribute("role", "listitem");
      if (folder.id === state.activeFolderId) {
        node.setAttribute("aria-current", "true");
      }
      node.addEventListener("click", () => setActiveFolder(folder.id));
      node.addEventListener("dragstart", (event) => onFolderDragStart(event, folder.id));
      node.addEventListener("dragenter", (event) => {
        event.preventDefault();
        if (drag.type === "folder") setDropTarget(event, true);
      });
      node.addEventListener("dragleave", (event) => setDropTarget(event, false));
      node.addEventListener("dragover", (event) => event.preventDefault());
      node.addEventListener("drop", (event) => {
        setDropTarget(event, false);
        onFolderDrop(event, folder.id);
      });
      node.addEventListener("dragend", () => {
        drag = { type: null, folderId: null, linkId: null };
        node.dataset.dropTarget = "false";
      });

      const left = document.createElement("div");
      left.className = "folderLeft";
      left.innerHTML = `
        <div class="emoji">${escapeHtml(folder.emoji || "📁")}</div>
        <div class="folderText">
          <p class="folderName">${escapeHtml(folder.name || "Untitled")}</p>
          <div class="folderMeta">${escapeHtml(spaceHealth(folder))}</div>
        </div>
      `;

      const actions = document.createElement("div");
      actions.className = "folderActions";

      const editBtn = document.createElement("button");
      editBtn.className = "iconBtn";
      editBtn.textContent = "Edit";
      editBtn.setAttribute("aria-label", `Edit ${folder.name}`);
      editBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        showFolderModal(folder);
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "iconBtn danger";
      deleteBtn.textContent = "Delete";
      deleteBtn.setAttribute("aria-label", `Delete ${folder.name}`);
      deleteBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        deleteFolder(folder.id);
      });

      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);

      node.appendChild(left);
      node.appendChild(actions);
      el.folderList.appendChild(node);
    });

    if (!folders.length) {
      const emptyFolders = document.createElement("div");
      emptyFolders.className = "empty";
      emptyFolders.innerHTML = `
        <p class="emptyTitle">No spaces</p>
        <p class="emptyCopy">Create a space to start organizing links.</p>
      `;
      const actions = document.createElement("div");
      actions.className = "emptyActions";
      actions.appendChild(mkButton("New space", { cls: "success", onClick: () => showFolderModal(null) }));
      emptyFolders.appendChild(actions);
      el.folderList.appendChild(emptyFolders);
    }

    const active = activeFolder();
    el.activeFolderName.textContent = active ? active.name : "—";
    el.activeFolderLinks.textContent = String(active ? (active.links || []).length : 0);

    el.btnOpenAll.disabled = !active || !(active.links || []).length;
    el.btnNewLink.disabled = !active;
    el.btnBulkAdd.disabled = !active;
    el.sortMode.disabled = !active || !(active.links || []).length;
    el.btnAddTabs.hidden = !tabsApi();
    el.btnAddTabs.disabled = !active;

    el.itemsGrid.innerHTML = "";
    const query = (el.searchInput.value || "").trim().toLowerCase();

    if (!active) {
      renderEmptyState({
        title: "No spaces yet",
        copy: "Create one space, then add the links that belong there.",
        actions: [
          mkButton("New space", { cls: "success", onClick: () => showFolderModal(null) })
        ]
      });
      return;
    }

    const links = sortLinksForView(active.links || []);
    const filtered = links.filter((link) => {
      if (!query) return true;
      const hay = `${link.title} ${link.url} ${link.notes || ""} ${domainOf(link.url)}`.toLowerCase();
      return hay.includes(query);
    });

    if (!filtered.length) {
      renderEmptyState(query ? {
        title: "No matching links",
        copy: `No results for <span class="kbd">${escapeHtml(query)}</span> in <strong>${escapeHtml(active.name)}</strong>.`,
        actions: [
          mkButton("Clear search", {
            cls: "ghost",
            onClick: () => {
              el.searchInput.value = "";
              render();
              el.searchInput.focus();
            }
          })
        ]
      } : {
        title: "No links yet",
        copy: `<strong>${escapeHtml(active.name)}</strong> is ready for links.`,
        actions: [
          mkButton("New link", { cls: "success", onClick: () => showLinkModal(null) }),
          mkButton("Add list", { cls: "ghost", onClick: showBulkAddModal }),
          mkButton("Capture", { cls: "ghost", onClick: showCaptureSetup })
        ]
      });
    } else {
      el.emptyState.style.display = "none";
    }

    filtered.forEach((link) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.linkId = link.id;
      card.dataset.captured = String(link.id === capturedLinkId);
      card.dataset.pinned = String(Boolean(link.pinned));
      card.draggable = canDragLinks();
      if (!card.draggable) {
        card.title = "Switch to Custom order to drag links.";
      }

      card.addEventListener("dragstart", (event) => onLinkDragStart(event, link.id));
      card.addEventListener("dragenter", (event) => {
        event.preventDefault();
        if (drag.type === "link" && canDragLinks()) setDropTarget(event, true);
      });
      card.addEventListener("dragleave", (event) => setDropTarget(event, false));
      card.addEventListener("dragover", (event) => {
        if (canDragLinks()) event.preventDefault();
      });
      card.addEventListener("drop", (event) => {
        setDropTarget(event, false);
        onLinkDrop(event, link.id);
      });
      card.addEventListener("dragend", () => {
        drag = { type: null, folderId: null, linkId: null };
        card.dataset.dropTarget = "false";
      });

      const tag = domainOf(link.url) || "link";
      const note = link.notes ? `<p class="note">${escapeHtml(link.notes)}</p>` : "";

      card.innerHTML = `
        <div class="cardTop">
          <div style="min-width:0">
            <div class="titleRow">
              <span class="pinMark" ${link.pinned ? "" : "hidden"} aria-label="Pinned">P</span>
              <p class="title">${escapeHtml(link.title)}</p>
            </div>
            <p class="url">${escapeHtml(link.url)}</p>
          </div>
        </div>
        ${note}
        <div class="cardMeta">
          <div class="tag">${escapeHtml(tag)}</div>
          <div class="tag">${escapeHtml(formatLastOpened(link.lastOpened))}</div>
        </div>
        <div class="cardActions">
          <button class="openAction" data-act="open" type="button">Open</button>
          <button data-act="copy" type="button">Copy</button>
          <button class="${link.pinned ? "warning" : ""}" data-act="pin" type="button">${link.pinned ? "Unpin" : "Pin"}</button>
          <button data-act="edit" type="button">Edit</button>
          <button class="danger" data-act="del" type="button">Delete</button>
        </div>
      `;

      card.querySelector('[data-act="open"]').addEventListener("click", () => openOne(link.url, link));
      card.querySelector('[data-act="copy"]').addEventListener("click", () => copyLink(link));
      card.querySelector('[data-act="pin"]').addEventListener("click", () => togglePinned(link.id));
      card.querySelector('[data-act="edit"]').addEventListener("click", () => showLinkModal(link));
      card.querySelector('[data-act="del"]').addEventListener("click", () => deleteLink(link.id));

      el.itemsGrid.appendChild(card);
    });
  }

  el.btnNewFolder.addEventListener("click", () => showFolderModal(null));
  el.btnPalette.addEventListener("click", openPalette);
  el.btnAddTabs.addEventListener("click", showTabsModal);
  el.btnCapture.addEventListener("click", showCaptureSetup);
  el.btnBulkAdd.addEventListener("click", showBulkAddModal);
  el.btnNewLink.addEventListener("click", () => showLinkModal(null));
  el.btnIO.addEventListener("click", showImportExport);
  el.btnSettings.addEventListener("click", showSettings);

  el.btnOpenAll.addEventListener("click", openAllInFolder);

  el.searchInput.addEventListener("input", render);
  el.btnClearSearch.addEventListener("click", () => {
    el.searchInput.value = "";
    render();
    el.searchInput.focus();
  });
  el.sortMode.addEventListener("change", () => {
    state.settings = {
      ...normalizeSettings(state.settings || {}),
      sortMode: SORT_MODES.has(el.sortMode.value) ? el.sortMode.value : defaultSettings.sortMode
    };
    saveState();
    render();
  });

  async function init() {
    await window.TDSStorage?.persist();
    state = await loadState();
    saveState({ silent: true });
    render();
    handleIncomingCapture();
  }

  init();
})();

</script>
</body>
</html>
