<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spaces | Talley Digital Studio</title>
  <meta name="description" content="Spaces by Talley Digital Studio. Local-first workspace launcher for grouped links." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../shared.css?v=20260614c" />
  <style>
:root{
  --bg:var(--tds-paper);
  --panel:rgba(244,241,234,.92);
  --panel-soft:rgba(255,255,255,.42);
  --panel-strong:rgba(244,241,234,.98);
  --stroke:var(--tds-line);
  --stroke-strong:var(--tds-ink);
  --control-text:rgba(26,27,31,.75);
  --text:var(--tds-ink);
  --muted:var(--tds-muted);
  --accent:var(--tds-accent);
  --accent-strong:var(--tds-accent-strong);
  --accent-soft:var(--tds-accent-soft);
  --open:var(--tds-open);
  --open-soft:rgba(0,119,217,.11);
  --open-border:rgba(0,119,217,.44);
  --success:var(--tds-success);
  --success-soft:rgba(19,138,66,.12);
  --success-border:rgba(19,138,66,.42);
  --danger:var(--tds-accent);
  --shadow:var(--tds-shadow);
  --shadow-red:var(--tds-shadow-red);
  --blur:14px;
  --r:var(--tds-radius);
  --r2:var(--tds-radius);
  --pad: 14px;
}

@media (prefers-color-scheme:dark){
  :root{
    --panel:rgba(29,28,24,.94);
    --panel-soft:rgba(244,241,234,.1);
    --panel-strong:rgba(36,34,29,.98);
    --stroke-strong:rgba(244,241,234,.46);
    --control-text:rgba(244,241,234,.74);
    --open-soft:rgba(88,170,255,.16);
    --open-border:rgba(88,170,255,.5);
    --success-soft:rgba(76,196,118,.15);
    --success-border:rgba(76,196,118,.5);
  }
}

html,body{height:100%}
body{
  color:var(--text);
  overflow:hidden;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:clamp(12px,2vw,22px);
  width:min(1720px,100%);
  margin:0 auto;
}

.site-banner{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  min-height:38px;
  padding:7px 11px;
  border-radius: 999px;
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  font-size:12px;
  color:var(--muted);
  width: fit-content;
}
.site-banner a{
  color:var(--text);
  text-decoration:none;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:38px;
}
.site-banner a:hover{
  color:var(--accent);
}

.topbar{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-radius: var(--r);
  background: var(--panel);
  border:1px solid var(--stroke-strong);
  backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width: 220px;
}
.orb{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--panel);
  border:1px solid var(--stroke-strong);
  box-shadow:3px 3px 0 rgba(215,25,32,.14);
  position:relative;
}
.orb:after{
  content:"";
  position:absolute;
  inset:10px 7px;
  border-bottom:4px solid var(--accent);
  transform:skewX(-18deg);
}
.brand h1{
  font-size:18px;
  margin:0;
  letter-spacing:0;
  font-weight:900;
  text-transform:uppercase;
}
.brand p{
  font-size:12px;
  color:var(--muted);
  margin:3px 0 0;
}

.search{
  flex:1 1 260px;
  min-width:min(100%,220px);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius: var(--r);
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.search:focus-within{
  background:var(--panel-strong);
  border-color:rgba(215,25,32,.48);
  box-shadow:0 0 0 3px rgba(215,25,32,.1);
}
.search input{
  width:100%;
  background:transparent;
  border:0;
  outline:none;
  color:var(--text);
  font-size:14px;
  font-family:inherit;
}
.search .hint{font-size:12px; color:var(--muted); white-space:nowrap}
.searchIcon{color:var(--muted); font-size:12px}

.btns{display:flex; gap:10px; align-items:center}
button{
  cursor:pointer;
  border:1px solid var(--stroke);
  background: var(--panel-soft);
  color:var(--text);
  padding:10px 12px;
  border-radius: var(--r);
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
  transition: transform .22s cubic-bezier(.16,1,.3,1), background .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
  box-shadow:none;
}
button:hover{
  background: var(--accent-soft);
  border-color: var(--accent);
  color:var(--accent);
}
button:active{transform: translateY(1px)}
button:focus-visible{
  outline: 2px solid rgba(215,25,32,.38);
  outline-offset: 2px;
}
button:disabled{
  cursor:not-allowed;
  opacity:0.6;
  box-shadow:none;
}

.primary{
  border-color: rgba(215,25,32,.44);
  background: rgba(215,25,32,.1);
  color:var(--accent);
}
.primary:hover{background: rgba(215,25,32,.14)}
.success{
  border-color: var(--success-border);
  background: var(--success-soft);
  color: var(--success);
}
.success:hover{
  border-color: var(--success);
  background: rgba(19,138,66,.17);
  color: var(--success);
}
.openAction{
  border-color: var(--open-border);
  background: var(--open-soft);
  color: var(--open);
}
.openAction:hover{
  border-color: var(--open);
  background: rgba(0,119,217,.16);
  color: var(--open);
}
.danger{
  border-color: rgba(215,25,32,.38);
  background: rgba(215,25,32,.1);
  color:var(--accent);
}
.ghost{
  background: transparent;
  box-shadow:none;
}

.content{
  flex:1;
  display:grid;
  grid-template-columns: minmax(290px,340px) minmax(0,1fr);
  gap:14px;
  min-height:0;
}

.panel{
  background: var(--panel);
  border:1px solid var(--stroke-strong);
  border-radius: var(--r);
  backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow);
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.panelHeader{
  padding:13px 14px 12px;
  border-bottom: 1px solid var(--stroke-strong);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.panelHeader h2{margin:0; font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--text); font-weight:900}
.panelHeader .mini{color:var(--muted); font-size:12px}
.panelActions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  min-width:0;
}
.panelActions button{
  padding:8px 10px;
  font-size:12px;
}

.scroll{
  overflow:auto;
  padding:12px;
  min-height:0;
}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background: rgba(26,27,31,.15); border-radius: 999px}
.scroll::-webkit-scrollbar-track{background: transparent}

.folder{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px;
  border-radius: var(--r2);
  border:1px solid var(--stroke);
  background: var(--panel-soft);
  margin-bottom:9px;
  user-select:none;
  overflow:hidden;
  transition:transform .28s cubic-bezier(.16,1,.3,1),border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.folder:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:0;
  background:var(--accent);
  transition:width .22s ease;
}
.folder:hover{
  transform:translateY(-1px);
  border-color:var(--stroke-strong);
  background:var(--panel-strong);
}
.folder[data-active="true"]{
  background: rgba(215,25,32,.075);
  border-color: rgba(215,25,32,.55);
  box-shadow:var(--shadow-red);
}
.folder[data-active="true"]:before{
  width:4px;
}
.folderLeft{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  position:relative;
  z-index:1;
}
.emoji{
  width:34px;
  height:34px;
  border-radius: 8px;
  display:grid;
  place-items:center;
  background: var(--panel-strong);
  border:1px solid var(--stroke);
  flex: 0 0 auto;
  font-size:16px;
}
.folderText{min-width:0}
.folderName{
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0;
  font-weight:900;
}
.folderMeta{font-size:12px; color:var(--muted); margin-top:2px}
.folderActions{display:flex; gap:8px; align-items:center; flex:0 0 auto; position:relative; z-index:1}
.iconBtn{min-height:38px; padding:9px 10px; border-radius: var(--r); font-size:11px}

.dragHint{font-size:11px; color:var(--muted); padding:10px 14px 0; text-transform:uppercase; letter-spacing:.04em}

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px 14px;
  border-bottom: 1px solid var(--stroke-strong);
  flex-wrap:wrap;
  background:var(--panel-soft);
}
.toolbar .search{
  flex:1 1 280px;
  max-width:520px;
}
.toolbarSpacer{flex:1}
.pill{
  display:flex;
  align-items:center;
  gap:8px;
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  padding:8px 10px;
  border-radius: var(--r);
  font-size:12px;
  color:var(--muted);
  min-height:38px;
}
.pill strong{color:var(--text); font-weight:900}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap:12px;
}

.card{
  border-radius: var(--r);
  background: var(--panel);
  border:1px solid var(--stroke);
  padding:13px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:132px;
  position:relative;
  user-select:none;
  overflow:hidden;
  transition:transform .32s cubic-bezier(.16,1,.3,1),border-color .2s ease,box-shadow .2s ease,background .2s ease;
}
.card:after{
  content:"";
  position:absolute;
  right:13px;
  top:13px;
  width:18px;
  height:3px;
  background:var(--accent);
  opacity:.9;
  pointer-events:none;
}
.card:hover{
  transform:translateY(-2px);
  border-color:var(--stroke-strong);
  background:var(--panel-strong);
  box-shadow:var(--shadow-red);
}
.card[data-drag="true"]{
  outline: 2px solid rgba(215,25,32,.55);
  outline-offset: 2px;
}
.card[data-captured="true"]{
  border-color:rgba(215,25,32,.75);
  box-shadow:0 0 0 3px rgba(215,25,32,.12), var(--shadow-red);
}
.cardTop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.title{margin:0; font-size:15px; line-height:1.1; word-break:break-word; text-transform:uppercase; letter-spacing:-.03em}
.title{font-weight:900}
.url{color:var(--muted); font-size:12px; word-break:break-all; margin:4px 0 0}
.tag{
  font-size:11px;
  color:var(--control-text);
  background: var(--panel-soft);
  border:1px solid var(--stroke);
  padding:6px 8px;
  border-radius: 999px;
  align-self:flex-start;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cardActions{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
.cardActions button{padding:8px 10px; font-size:12px}

.empty{
  padding:22px 14px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  border:1px dashed var(--stroke);
  border-radius:var(--r);
  background:var(--panel-soft);
}
.kbd{
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:11px;
  padding:2px 6px;
  border-radius: 6px;
  border:1px solid var(--stroke);
  background: var(--panel-soft);
  color:var(--control-text);
}

.modalBg{
  position:fixed;
  inset:0;
  background: rgba(16,18,20,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:50;
}
.modalBg[data-open="true"]{display:flex}
.modal{
  width:min(720px, 100%);
  border-radius: var(--r);
  background: var(--panel-strong);
  border:1px solid var(--stroke);
  backdrop-filter: blur(18px);
  box-shadow: 0 30px 120px rgba(0,0,0,.25);
  overflow:hidden;
}
.modalHead{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--stroke);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.modalHead h3{margin:0; font-size:14px}
.modalBody{padding:14px}
.form{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px;
}
.form .full{grid-column: 1 / -1}
label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:0 0 6px;
}
input, textarea, select{
  width:100%;
  border-radius: var(--r);
  border:1px solid var(--stroke);
  background: var(--panel);
  color: var(--text);
  padding:10px 11px;
  outline:none;
  font-size:13px;
  font-family:inherit;
}
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  border-color: rgba(215,25,32,.58);
  box-shadow: 0 0 0 3px rgba(215,25,32,.13),1px 0 rgba(17,17,17,.16);
}
textarea{min-height:92px; resize:vertical}
.tabImport{
  border:1px solid var(--stroke);
  border-radius:var(--r);
  background:var(--panel-soft);
  padding:11px;
  display:grid;
  gap:10px;
}
.tabImportHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.tabImportHead label{margin-bottom:3px}
.tabImportCopy{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
}
.tabImportHead button{
  padding:8px 10px;
  font-size:11px;
  flex:0 0 auto;
}
.captureSteps{
  margin:0;
  padding-left:18px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
[hidden]{display:none !important}
.modalFoot{
  padding:12px 14px 14px;
  border-top:1px solid var(--stroke);
  display:flex;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
}
.hr{height:1px; background: var(--stroke); margin:12px 0}
.tiny{font-size:12px; color:var(--muted); line-height:1.4}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background: rgba(17,24,39,0.92);
  color: #fff;
  padding:10px 14px;
  border-radius: var(--r);
  font-size:12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  opacity:0;
  transform: translateY(8px);
  pointer-events:none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast[data-show="true"]{
  opacity:1;
  transform: translateY(0);
}

.paletteBg{
  position:fixed;
  inset:0;
  z-index:55;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:9vh 16px 16px;
  background:rgba(17,17,17,.2);
  backdrop-filter:blur(6px);
}
.paletteBg[data-open="true"]{display:flex}
.palette{
  width:min(680px,100%);
  border:1px solid var(--stroke-strong);
  border-radius:var(--r);
  background:var(--panel-strong);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.palette input{
  border:0;
  border-bottom:1px solid var(--stroke);
  border-radius:0;
  background:transparent;
  font-size:18px;
  padding:16px;
}
.paletteResults{
  max-height:min(52vh,420px);
  overflow:auto;
  padding:8px;
}
.paletteItem{
  width:100%;
  display:grid;
  grid-template-columns:80px minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  text-align:left;
  border-color:transparent;
  background:transparent;
  padding:11px 10px;
}
.paletteItem:hover,
.paletteItem:focus-visible{
  border-color:var(--stroke);
  background:var(--panel-soft);
  color:var(--text);
}
.paletteItem span:first-child{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.paletteItem strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.paletteItem em{
  color:var(--muted);
  font-style:normal;
  font-size:12px;
}
.openQueue{
  position:fixed;
  right:18px;
  bottom:72px;
  z-index:45;
  width:min(360px,calc(100vw - 36px));
  border:1px solid var(--stroke-strong);
  border-radius:var(--r);
  background:var(--panel-strong);
  box-shadow:var(--shadow);
  padding:12px;
  display:none;
}
.openQueue[data-open="true"]{display:block}
.openQueue strong{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.queueItem{
  display:grid;
  grid-template-columns:12px minmax(0,1fr);
  gap:8px;
  align-items:center;
  color:var(--muted);
  font-size:12px;
  padding:6px 0;
  border-top:1px solid var(--stroke);
}
.queueItem:first-of-type{border-top:0}
.queueDot{
  width:8px;
  height:8px;
  border-radius:50%;
  border:1px solid var(--stroke-strong);
  background:var(--panel);
}
.queueItem[data-state="open"] .queueDot{background:var(--open); border-color:var(--open)}
.queueItem[data-state="blocked"] .queueDot{background:var(--accent); border-color:var(--accent)}

.noscript{
  position:fixed;
  inset:18px auto auto 18px;
  background: #111827;
  color:#fff;
  padding:12px 14px;
  border-radius: var(--r);
  font-size:12px;
  z-index:60;
}

@media (max-width: 1100px){
  .content{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
}
@media (max-width: 860px){
  body{overflow:auto}
  .app{overflow:auto}
  .content{grid-template-columns: 1fr;}
  .brand{min-width:auto}
  .grid{grid-template-columns: 1fr;}
  .topbar{flex-direction:column; align-items:stretch}
  .btns{justify-content:stretch}
  .btns button{flex:1}
  .toolbar .search{max-width:none}
  .panelHeader,.toolbar{align-items:flex-start}
}

</style>
</head>
<body>
  <div class="app">
    <div class="site-banner">
      <a href="/#work" aria-label="Back to Talley Digital Studio work">← Talley Digital Studio</a>
    </div>
    <header class="topbar">
      <div class="brand">
        <div class="orb"></div>
        <div>
          <h1>spaces</h1>
          <p>Talley Digital Studio · local workspace launcher</p>
        </div>
      </div>
      <time class="release-stamp" datetime="2026-06-16T17:02:36-04:00">rel 2026-06-16 17:02 EDT</time>

      <div class="btns">
        <button id="btnIO" class="ghost" type="button">Import/Export</button>
        <button id="btnSettings" class="ghost" type="button">Settings</button>
      </div>
    </header>

    <div class="content">
      <section class="panel" aria-label="Spaces">
        <div class="panelHeader">
          <h2>Spaces</h2>
          <div class="panelActions">
            <div class="mini"><span id="folderCount">0</span></div>
            <button id="btnNewFolder" class="success" type="button">New space</button>
          </div>
        </div>
        <div class="dragHint">Drag spaces to reorder.</div>
        <div id="folderList" class="scroll" role="list"></div>
      </section>

      <section class="panel" aria-label="Links">
        <div class="toolbar">
          <div class="pill">
            Active: <strong id="activeFolderName">—</strong>
          </div>
          <div class="pill">
            Links: <strong id="activeFolderLinks">0</strong>
          </div>
          <div class="search" title="Search links in the current space">
            <span class="searchIcon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="text" placeholder="Search links…" aria-label="Search links" />
            <span class="hint"><span class="kbd">/</span> focus</span>
          </div>
          <div class="toolbarSpacer"></div>
          <button id="btnAddTabs" class="openAction" type="button" hidden>Add from tabs</button>
          <button id="btnCapture" class="ghost" type="button">Capture</button>
          <button id="btnNewLink" class="success" type="button">New link</button>
          <button id="btnOpenAll" class="openAction" type="button" title="Open all links in this space">Open all</button>
        </div>
        <div id="itemsWrap" class="scroll">
          <div id="itemsGrid" class="grid"></div>
          <div id="emptyState" class="empty" role="status" aria-live="polite" style="display:none;"></div>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="openQueue" class="openQueue" aria-live="polite"></div>

  <div id="paletteBg" class="paletteBg" data-open="false" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette">
      <input id="paletteInput" type="text" placeholder="Search spaces and links..." autocomplete="off" />
      <div id="paletteResults" class="paletteResults"></div>
    </div>
  </div>

  <div id="modalBg" class="modalBg" data-open="false" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modalHead">
        <h3 id="modalTitle">Modal</h3>
        <button id="modalClose" class="ghost" type="button">Close</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
      <div class="modalFoot" id="modalFoot"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">spaces needs JavaScript enabled to work.</div>
  </noscript>

  <script>
(() => {
  "use strict";

  const LS_KEY = "spaces_v1";
  const LEGACY_KEYS = ["workspace_switcher_v1"];
  const now = () => Date.now();

  const defaultSettings = {
    openMode: "tabs",
    confirmOpenAll: true,
    maxOpenAll: 24,
    openDelayMs: 80
  };

  const el = {
    folderList: document.getElementById("folderList"),
    folderCount: document.getElementById("folderCount"),
    activeFolderName: document.getElementById("activeFolderName"),
    activeFolderLinks: document.getElementById("activeFolderLinks"),
    itemsGrid: document.getElementById("itemsGrid"),
    emptyState: document.getElementById("emptyState"),
    searchInput: document.getElementById("searchInput"),
    btnNewFolder: document.getElementById("btnNewFolder"),
    btnAddTabs: document.getElementById("btnAddTabs"),
    btnCapture: document.getElementById("btnCapture"),
    btnNewLink: document.getElementById("btnNewLink"),
    btnIO: document.getElementById("btnIO"),
    btnSettings: document.getElementById("btnSettings"),
    btnOpenAll: document.getElementById("btnOpenAll"),
    toast: document.getElementById("toast"),
    openQueue: document.getElementById("openQueue"),
    paletteBg: document.getElementById("paletteBg"),
    paletteInput: document.getElementById("paletteInput"),
    paletteResults: document.getElementById("paletteResults"),

    modalBg: document.getElementById("modalBg"),
    modalTitle: document.getElementById("modalTitle"),
    modalBody: document.getElementById("modalBody"),
    modalFoot: document.getElementById("modalFoot"),
    modalClose: document.getElementById("modalClose")
  };

  let state = loadState();
  let capturedLinkId = null;
  saveState({ silent: true });

  function createId() {
    return crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(16).slice(2) + "-" + now());
  }

  function seedData() {
    const id = createId;
    const work = id();
    const life = id();
    const learn = id();

    return {
      version: 1,
      settings: { ...defaultSettings },
      activeFolderId: work,
      folders: [
        {
          id: work,
          name: "Work",
          emoji: "🧠",
          createdAt: now(),
          order: 0,
          links: [
            { id: id(), title: "Email", url: "https://mail.google.com/", createdAt: now(), order: 0 },
            { id: id(), title: "Calendar", url: "https://calendar.google.com/", createdAt: now(), order: 1 },
            { id: id(), title: "GitHub", url: "https://github.com/", createdAt: now(), order: 2 }
          ]
        },
        {
          id: life,
          name: "Life",
          emoji: "✨",
          createdAt: now(),
          order: 1,
          links: [
            { id: id(), title: "YouTube", url: "https://www.youtube.com/", createdAt: now(), order: 0 },
            { id: id(), title: "Spotify", url: "https://open.spotify.com/", createdAt: now(), order: 1 }
          ]
        },
        {
          id: learn,
          name: "Learn",
          emoji: "📚",
          createdAt: now(),
          order: 2,
          links: [
            { id: id(), title: "MDN", url: "https://developer.mozilla.org/", createdAt: now(), order: 0 },
            { id: id(), title: "Stack Overflow", url: "https://stackoverflow.com/", createdAt: now(), order: 1 }
          ]
        }
      ]
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        return normalizeState(data);
      }

      for (const key of LEGACY_KEYS) {
        const legacyRaw = localStorage.getItem(key);
        if (!legacyRaw) continue;
        const legacyData = JSON.parse(legacyRaw);
        return normalizeState(legacyData);
      }

      return seedData();
    } catch (err) {
      return seedData();
    }
  }

  function saveState({ silent = false } = {}) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (err) {
      if (!silent) {
        notify("Unable to save changes. Check localStorage permissions.");
      }
    }
  }

  window.addEventListener("storage", (event) => {
    if (event.key !== LS_KEY || !event.newValue) return;
    try {
      state = normalizeState(JSON.parse(event.newValue));
      render();
      notify("Spaces updated from another tab.");
    } catch (err) {
      notify("Could not read updated spaces data.");
    }
  });

  function normalizeState(data) {
    if (!data || typeof data !== "object") {
      return seedData();
    }

    const settings = normalizeSettings(data.settings || {});
    const rawFolders = Array.isArray(data.folders) ? data.folders : [];
    const folders = rawFolders.map((folder, index) => normalizeFolder(folder, index)).filter(Boolean);

    ensureUniqueFolderIds(folders);
    folders.forEach((folder) => ensureUniqueLinkIds(folder));

    const activeFolderId = folders.find((f) => f.id === data.activeFolderId)?.id || (folders[0]?.id ?? null);

    const normalized = {
      version: 1,
      settings,
      activeFolderId,
      folders
    };

    normalizeOrders(normalized);
    return normalized;
  }

  function normalizeSettings(raw) {
    const openMode = raw.openMode === "window" ? "window" : "tabs";
    const confirmOpenAll = Boolean(raw.confirmOpenAll);
    const maxOpenAll = clampInt(raw.maxOpenAll, 1, 100, defaultSettings.maxOpenAll);
    const openDelayMs = clampInt(raw.openDelayMs, 0, 2000, defaultSettings.openDelayMs);
    return { openMode, confirmOpenAll, maxOpenAll, openDelayMs };
  }

  function normalizeFolder(raw, fallbackOrder) {
    if (!raw || typeof raw !== "object") {
      return null;
    }
    const id = typeof raw.id === "string" && raw.id ? raw.id : createId();
    const name = typeof raw.name === "string" && raw.name.trim() ? raw.name.trim() : "Untitled";
    const emoji = clipGraphemes(typeof raw.emoji === "string" ? raw.emoji.trim() : "📁", 4) || "📁";
    const createdAt = typeof raw.createdAt === "number" ? raw.createdAt : now();
    const order = typeof raw.order === "number" ? raw.order : fallbackOrder;
    const linksRaw = Array.isArray(raw.links) ? raw.links : [];
    const links = linksRaw.map((link, index) => normalizeLink(link, index)).filter(Boolean);

    return { id, name, emoji, createdAt, order, links };
  }

  function normalizeLink(raw, fallbackOrder) {
    if (!raw || typeof raw !== "object") {
      return null;
    }
    const id = typeof raw.id === "string" && raw.id ? raw.id : createId();
    const url = typeof raw.url === "string" ? safeUrl(raw.url.trim()) : null;
    if (!url) {
      return null;
    }
    const titleRaw = typeof raw.title === "string" ? raw.title.trim() : "";
    const title = titleRaw || domainOf(url) || "Untitled";
    const createdAt = typeof raw.createdAt === "number" ? raw.createdAt : now();
    const lastOpened = typeof raw.lastOpened === "number" ? raw.lastOpened : 0;
    const order = typeof raw.order === "number" ? raw.order : fallbackOrder;

    return { id, title, url, createdAt, lastOpened, order };
  }

  function ensureUniqueFolderIds(folders) {
    const seen = new Set();
    folders.forEach((folder) => {
      if (seen.has(folder.id)) {
        folder.id = createId();
      }
      seen.add(folder.id);
    });
  }

  function ensureUniqueLinkIds(folder) {
    const seen = new Set();
    folder.links.forEach((link) => {
      if (seen.has(link.id)) {
        link.id = createId();
      }
      seen.add(link.id);
    });
  }

  function byOrder(a, b) {
    return (a.order ?? 0) - (b.order ?? 0);
  }

  function normalizeOrders(target = state) {
    const folders = [...target.folders].sort(byOrder);
    folders.forEach((folder, index) => {
      folder.order = index;
      const links = [...(folder.links || [])].sort(byOrder);
      links.forEach((link, linkIndex) => {
        link.order = linkIndex;
      });
      folder.links = links;
    });
    target.folders = folders;
  }

  function activeFolder() {
    const match = state.folders.find((f) => f.id === state.activeFolderId);
    if (match) return match;
    return state.folders[0] || null;
  }

  function setActiveFolder(folderId) {
    state.activeFolderId = folderId;
    saveState();
    render();
  }

  function safeUrl(input) {
    if (!input) return null;
    const trimmed = input.trim();
    const hasScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(trimmed);
    const candidate = hasScheme ? trimmed : `https://${trimmed}`;
    try {
      const url = new URL(candidate);
      const allowed = ["http:", "https:", "mailto:"];
      if (!allowed.includes(url.protocol)) return null;
      return url.toString();
    } catch (err) {
      return null;
    }
  }

  function domainOf(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch (err) {
      return "";
    }
  }

  function formatLastOpened(value) {
    if (!value) return "never opened";
    const diff = now() - value;
    const day = 24 * 60 * 60 * 1000;
    if (diff < day) return "opened today";
    if (diff < day * 7) return `opened ${Math.max(1, Math.floor(diff / day))}d ago`;
    return `opened ${Math.max(1, Math.floor(diff / (day * 7)))}w ago`;
  }

  function spaceHealth(folder) {
    const links = folder.links || [];
    const count = links.length;
    const lastOpened = links.reduce((latest, link) => Math.max(latest, link.lastOpened || 0), 0);
    const hint = count ? formatLastOpened(lastOpened) : "ready for links";
    return `${count} link${count === 1 ? "" : "s"} · ${hint}`;
  }

  function tabsApi() {
    if (globalThis.browser?.tabs?.query) {
      return {
        query: (queryInfo) => globalThis.browser.tabs.query(queryInfo)
      };
    }

    if (globalThis.chrome?.tabs?.query) {
      return {
        query: (queryInfo) => new Promise((resolve, reject) => {
          globalThis.chrome.tabs.query(queryInfo, (tabs) => {
            const err = globalThis.chrome.runtime?.lastError;
            if (err) {
              reject(new Error(err.message));
              return;
            }
            resolve(tabs || []);
          });
        })
      };
    }

    return null;
  }

  async function currentWindowTabs() {
    const api = tabsApi();
    if (!api) return [];

    try {
      const tabs = await api.query({ currentWindow: true });
      return tabs
        .map((tab) => ({
          id: tab.id,
          title: typeof tab.title === "string" ? tab.title.trim() : "",
          url: safeUrl(typeof tab.url === "string" ? tab.url : "")
        }))
        .filter((tab) => tab.url);
    } catch (err) {
      return [];
    }
  }

  function tabOptionLabel(tab) {
    const title = tab.title || domainOf(tab.url) || "Untitled";
    const domain = domainOf(tab.url);
    return domain ? `${title} - ${domain}` : title;
  }

  function addLinkToFolder(folder, link) {
    const title = (link.title || "").trim() || domainOf(link.url) || "Untitled";
    const url = safeUrl(link.url);
    if (!folder || !url) return false;

    const existing = (folder.links || []).find((item) => item.url === url);
    if (existing) {
      existing.title = existing.title || title;
      existing.lastOpened = now();
      return existing;
    }

    const maxOrder = Math.max(-1, ...(folder.links || []).map((item) => item.order ?? 0));
    const saved = {
      id: createId(),
      title,
      url,
      createdAt: now(),
      order: maxOrder + 1
    };
    folder.links.push(saved);
    return saved;
  }

  function folderOptions(selectedId) {
    return [...state.folders].sort(byOrder).map((folder) => (
      `<option value="${escapeHtml(folder.id)}"${folder.id === selectedId ? " selected" : ""}>${escapeHtml(folder.name)}</option>`
    )).join("");
  }

  function bookmarkletCode(folderId = "") {
    const target = `${window.location.origin}${window.location.pathname}`;
    const folderPart = folderId ? `+'&space=${encodeURIComponent(folderId)}'` : "";
    return `javascript:(()=>{const s=${JSON.stringify(target)};const u=encodeURIComponent(location.href);const t=encodeURIComponent(document.title||location.hostname||location.href);location.href=s+'?capture=1&addUrl='+u+'&addTitle='+t${folderPart};})()`;
  }

  function showCaptureSetup() {
    const folder = activeFolder();
    const code = () => bookmarkletCode(wrap.querySelector("#capture_space")?.value || folder?.id || "");
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="form">
        <div class="full">
          <label>Save captured pages to</label>
          <select id="capture_space">
            ${folderOptions(folder?.id || state.folders[0]?.id || "")}
          </select>
        </div>
        <div class="full">
          <ol class="captureSteps">
            <li>Click <b>Copy bookmarklet</b>.</li>
            <li>Create a bookmark named <b>Add to Spaces</b>.</li>
            <li>Paste it as the bookmark URL for one-click capture into the selected space.</li>
          </ol>
        </div>
      </div>
    `;

    const btnCopy = mkButton("Copy bookmarklet", {
      cls: "primary",
      onClick: async () => {
        try {
          await navigator.clipboard.writeText(code());
          notify("Bookmarklet copied.");
        } catch (err) {
          notify("Copy blocked by the browser.");
        }
      }
    });

    openModal({ title: "Capture pages", body: wrap, footer: [btnCopy] });
  }

  function clipGraphemes(value, limit) {
    return Array.from(value).slice(0, limit).join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function notify(message) {
    if (!el.toast) return;
    el.toast.textContent = message;
    el.toast.dataset.show = "true";
    window.clearTimeout(notify._timer);
    notify._timer = window.setTimeout(() => {
      el.toast.dataset.show = "false";
    }, 2200);
  }

  function isTextInput(target) {
    if (!target) return false;
    const tag = target.tagName ? target.tagName.toLowerCase() : "";
    return tag === "input" || tag === "textarea" || tag === "select" || target.isContentEditable;
  }

  function openModal({ title, body, footer }) {
    el.modalTitle.textContent = title;
    el.modalBody.innerHTML = "";
    el.modalFoot.innerHTML = "";
    el.modalBody.appendChild(body);
    footer.forEach((btn) => el.modalFoot.appendChild(btn));
    el.modalBg.dataset.open = "true";
  }

  function closeModal() {
    el.modalBg.dataset.open = "false";
    el.modalBody.innerHTML = "";
    el.modalFoot.innerHTML = "";
  }

  function mkButton(label, { cls = "", onClick }) {
    const button = document.createElement("button");
    button.textContent = label;
    button.className = cls;
    button.type = "button";
    button.addEventListener("click", onClick);
    return button;
  }

  el.modalClose.addEventListener("click", closeModal);
  el.modalBg.addEventListener("click", (event) => {
    if (event.target === el.modalBg) closeModal();
  });
  el.paletteBg.addEventListener("click", (event) => {
    if (event.target === el.paletteBg) closePalette();
  });
  el.paletteInput.addEventListener("input", renderPalette);
  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      openPalette();
      return;
    }
    if (event.key === "Escape" && el.modalBg.dataset.open === "true") {
      closeModal();
    }
    if (event.key === "Escape" && el.paletteBg.dataset.open === "true") {
      closePalette();
    }
    if (event.key === "/" && !isTextInput(document.activeElement)) {
      event.preventDefault();
      el.searchInput.focus();
    }
  });

  function paletteItems() {
    const items = [];
    [...state.folders].sort(byOrder).forEach((folder) => {
      items.push({
        type: "space",
        folder,
        title: folder.name,
        meta: spaceHealth(folder)
      });
      [...(folder.links || [])].sort(byOrder).forEach((link) => {
        items.push({
          type: "link",
          folder,
          link,
          title: link.title,
          meta: `${folder.name} · ${domainOf(link.url) || "link"}`
        });
      });
    });
    return items;
  }

  function openPalette() {
    el.paletteBg.dataset.open = "true";
    el.paletteInput.value = "";
    renderPalette();
    window.setTimeout(() => el.paletteInput.focus(), 0);
  }

  function closePalette() {
    el.paletteBg.dataset.open = "false";
    el.paletteResults.innerHTML = "";
  }

  function renderPalette() {
    const query = (el.paletteInput.value || "").trim().toLowerCase();
    const results = paletteItems().filter((item) => {
      if (!query) return true;
      const hay = `${item.type} ${item.title} ${item.meta} ${item.link?.url || ""}`.toLowerCase();
      return hay.includes(query);
    }).slice(0, 18);

    el.paletteResults.innerHTML = "";
    if (!results.length) {
      el.paletteResults.innerHTML = `<div class="empty">No spaces or links match <span class="kbd">${escapeHtml(query)}</span>.</div>`;
      return;
    }

    results.forEach((item) => {
      const button = document.createElement("button");
      button.className = "paletteItem";
      button.type = "button";
      button.innerHTML = `
        <span>${item.type}</span>
        <strong>${escapeHtml(item.title)}</strong>
        <em>${escapeHtml(item.meta)}</em>
      `;
      button.addEventListener("click", () => {
        if (item.type === "space") {
          setActiveFolder(item.folder.id);
        } else {
          state.activeFolderId = item.folder.id;
          openOne(item.link.url, item.link);
          saveState();
          render();
        }
        closePalette();
      });
      el.paletteResults.appendChild(button);
    });
  }

  function showFolderModal(folder) {
    const isEdit = Boolean(folder);
    const draft = folder ? { ...folder } : { id: createId(), name: "", emoji: "📁" };

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="form">
        <div>
          <label>Space name</label>
          <input id="f_name" placeholder="e.g., Work, School, Morning" value="${escapeHtml(draft.name || "")}">
        </div>
        <div>
          <label>Emoji</label>
          <input id="f_emoji" placeholder="e.g., 🧠" value="${escapeHtml(draft.emoji || "📁")}">
        </div>
        <div class="full tiny">
          Tip: keep spaces simple so “Open all” stays quick and predictable.
        </div>
      </div>
    `;

    const btnSave = mkButton(isEdit ? "Save changes" : "Create space", {
      cls: "primary",
      onClick: () => {
        const nameInput = wrap.querySelector("#f_name");
        const emojiInput = wrap.querySelector("#f_emoji");
        const name = nameInput.value.trim();
        const emoji = clipGraphemes(emojiInput.value.trim() || "📁", 4) || "📁";

        if (!name) {
          alert("Space name is required.");
          nameInput.focus();
          return;
        }

        if (isEdit) {
          const target = state.folders.find((item) => item.id === folder.id);
          if (!target) return;
          target.name = name;
          target.emoji = emoji;
        } else {
          const maxOrder = Math.max(-1, ...state.folders.map((item) => item.order ?? 0));
          state.folders.push({
            id: draft.id,
            name,
            emoji,
            createdAt: now(),
            order: maxOrder + 1,
            links: []
          });
          state.activeFolderId = draft.id;
        }

        normalizeOrders();
        saveState();
        render();
        closeModal();
      }
    });

    openModal({ title: isEdit ? "Edit space" : "New space", body: wrap, footer: [btnSave] });
    setTimeout(() => wrap.querySelector("#f_name").focus(), 30);
  }

  async function showTabsModal() {
    const folder = activeFolder();
    if (!folder || !tabsApi()) return;

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="tabImport">
        <div class="tabImportHead">
          <div>
            <label for="tab_import_select">Current window tabs</label>
            <p class="tabImportCopy">Choose a tab to add to ${escapeHtml(folder.name)}.</p>
          </div>
          <button id="tab_import_refresh" class="ghost" type="button">Refresh</button>
        </div>
        <select id="tab_import_select" aria-label="Current window tabs" disabled>
          <option value="">Loading tabs...</option>
        </select>
      </div>
    `;

    const select = wrap.querySelector("#tab_import_select");
    const refresh = wrap.querySelector("#tab_import_refresh");
    const btnAdd = mkButton("Add tab", {
      cls: "primary",
      onClick: () => {
        const tab = select._tabs?.[Number(select.value)];
        if (!tab) return;
        if (!addLinkToFolder(folder, tab)) return;
        normalizeOrders();
        saveState();
        render();
        closeModal();
        notify("Tab added.");
      }
    });
    btnAdd.disabled = true;

    const loadTabs = async () => {
      select.disabled = true;
      refresh.disabled = true;
      btnAdd.disabled = true;
      select.innerHTML = `<option value="">Loading tabs...</option>`;

      const tabs = await currentWindowTabs();
      if (!wrap.isConnected) return;

      refresh.disabled = false;
      select._tabs = tabs;

      if (!tabs.length) {
        select.innerHTML = `<option value="">No selectable tabs in this window</option>`;
        return;
      }

      select.disabled = false;
      select.innerHTML = [
        `<option value="">Choose a tab...</option>`,
        ...tabs.map((tab, index) => (
          `<option value="${index}">${escapeHtml(tabOptionLabel(tab))}</option>`
        ))
      ].join("");
    };

    select.addEventListener("change", () => {
      btnAdd.disabled = select.value === "";
    });
    refresh.addEventListener("click", loadTabs);

    openModal({ title: `Add from tabs -> ${folder.name}`, body: wrap, footer: [btnAdd] });
    await loadTabs();
  }

  function deleteFolder(folderId) {
    const folder = state.folders.find((item) => item.id === folderId);
    if (!folder) return;

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="tiny">
        Delete <b>${escapeHtml(folder.name)}</b> and its <b>${(folder.links || []).length}</b> link(s)?
        <div class="hr"></div>
        This cannot be undone (unless you export first).
      </div>
    `;

    const btnDelete = mkButton("Delete", {
      cls: "danger",
      onClick: () => {
        state.folders = state.folders.filter((item) => item.id !== folderId);
        normalizeOrders();
        state.activeFolderId = state.folders[0]?.id ?? null;
        saveState();
        render();
        closeModal();
      }
    });

    openModal({ title: "Delete space", body: wrap, footer: [btnDelete] });
  }

  function showLinkModal(link, prefill = null) {
    const folder = activeFolder();
    if (!folder) {
      alert("Create a space first.");
      return;
    }

    const isEdit = Boolean(link);
    const draft = link ? { ...link } : {
      id: createId(),
      title: prefill?.title || "",
      url: prefill?.url || ""
    };

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="form">
        <div class="full">
          <label>Title</label>
          <input id="l_title" placeholder="e.g., Gmail, Jira, Canvas" value="${escapeHtml(draft.title || "")}">
        </div>
        <div class="full">
          <label>URL</label>
          <input id="l_url" placeholder="https://…" value="${escapeHtml(draft.url || "")}">
        </div>
        <div class="full">
          <label>Space</label>
          <select id="l_folder">
            ${folderOptions(folder.id)}
          </select>
        </div>
        <div class="full tiny">
          Tip: you can paste “google.com” and spaces will fix it to https://google.com
        </div>
      </div>
    `;

    const btnSave = mkButton(isEdit ? "Save changes" : "Add link", {
      cls: "primary",
      onClick: () => {
        const titleInput = wrap.querySelector("#l_title");
        const urlInput = wrap.querySelector("#l_url");
        const folderInput = wrap.querySelector("#l_folder");

        const title = titleInput.value.trim();
        const urlRaw = urlInput.value.trim();
        const url = safeUrl(urlRaw);
        const targetFolder = state.folders.find((item) => item.id === folderInput.value) || folder;

        if (!title) {
          alert("Title is required.");
          titleInput.focus();
          return;
        }
        if (!url) {
          alert("Enter a valid URL (http, https, or mailto).");
          urlInput.focus();
          return;
        }

        if (isEdit) {
          const target = folder.links.find((item) => item.id === link.id);
          if (!target) return;
          target.title = title;
          target.url = url;
          if (targetFolder.id !== folder.id) {
            folder.links = folder.links.filter((item) => item.id !== link.id);
            target.order = Math.max(-1, ...(targetFolder.links || []).map((item) => item.order ?? 0)) + 1;
            targetFolder.links.push(target);
            state.activeFolderId = targetFolder.id;
          }
        } else {
          addLinkToFolder(targetFolder, { title, url });
          state.activeFolderId = targetFolder.id;
        }

        normalizeOrders();
        saveState();
        render();
        closeModal();
      }
    });

    openModal({ title: isEdit ? "Edit link" : `New link → ${folder.name}`, body: wrap, footer: [btnSave] });
    setTimeout(() => wrap.querySelector("#l_title").focus(), 30);
  }

  function handleIncomingCapture() {
    const params = new URLSearchParams(window.location.search);
    const capturedUrl = safeUrl(params.get("addUrl") || "");
    if (!capturedUrl) return;

    const captured = new URL(capturedUrl);
    const here = new URL(window.location.href);
    if (captured.origin === here.origin && captured.pathname === here.pathname) {
      const cleanSelfUrl = `${window.location.origin}${window.location.pathname}${window.location.hash}`;
      window.history.replaceState(null, "", cleanSelfUrl);
      notify("Open another page, then click the Add to Spaces bookmark.");
      return;
    }

    const title = (params.get("addTitle") || domainOf(capturedUrl) || "Untitled").trim();
    const cleanUrl = `${window.location.origin}${window.location.pathname}${window.location.hash}`;
    window.history.replaceState(null, "", cleanUrl);

    const targetFolder = state.folders.find((item) => item.id === params.get("space")) || activeFolder();
    if (!targetFolder) {
      showLinkModal(null, { title, url: capturedUrl });
      return;
    }

    const saved = addLinkToFolder(targetFolder, { title, url: capturedUrl });
    if (!saved) return;

    capturedLinkId = saved.id;
    state.activeFolderId = targetFolder.id;
    el.searchInput.value = "";
    normalizeOrders();
    saveState();
    render();
    notify(`Captured to ${targetFolder.name}.`);

    window.setTimeout(() => {
      const card = el.itemsGrid.querySelector(`[data-link-id="${CSS.escape(saved.id)}"]`);
      card?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }, 80);
  }

  function deleteLink(linkId) {
    const folder = activeFolder();
    if (!folder) return;
    const link = (folder.links || []).find((item) => item.id === linkId);
    if (!link) return;

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="tiny">
        Delete <b>${escapeHtml(link.title)}</b> from <b>${escapeHtml(folder.name)}</b>?
        <div class="hr"></div>
        This removes the saved link only. It cannot be undone unless you exported first.
      </div>
    `;

    const btnDelete = mkButton("Delete", {
      cls: "danger",
      onClick: () => {
        folder.links = (folder.links || []).filter((item) => item.id !== linkId);
        normalizeOrders();
        saveState();
        render();
        closeModal();
      }
    });

    openModal({ title: "Delete link", body: wrap, footer: [btnDelete] });
  }

  async function openAllInFolder() {
    const folder = activeFolder();
    if (!folder) return;

    const links = (folder.links || []).sort(byOrder).filter((link) => safeUrl(link.url));
    if (!links.length) {
      alert("No valid links in this space.");
      return;
    }

    const settings = normalizeSettings(state.settings || {});
    const cap = Math.max(1, settings.maxOpenAll || 24);
    const toOpen = links.slice(0, cap);

    if (settings.confirmOpenAll) {
      const targetName = settings.openMode === "window" ? "windows" : "tabs";
      const ok = confirm(`Open ${toOpen.length}${links.length > cap ? " (capped)" : ""} ${targetName} from "${folder.name}"?`);
      if (!ok) return;
    }

    showQueue(folder, toOpen);

    if (settings.openMode === "window") {
      let opened = 0;
      for (let index = 0; index < toOpen.length; index++) {
        const item = toOpen[index];
        const win = openWindow(item.url, index);
        if (!win && opened === 0) {
          setQueueState(item.id, "blocked");
          alert("Popup blocked. Allow popups or switch to tabs mode in Settings.");
          return;
        }
        if (win) {
          opened += 1;
          markOpened(item);
          setQueueState(item.id, "open");
        } else {
          setQueueState(item.id, "blocked");
        }
        await sleep(settings.openDelayMs || 80);
      }
      finishQueue();
      saveState();
      render();
      return;
    }

    let opened = 0;
    for (const item of toOpen) {
      const win = window.open(item.url, "_blank");
      if (!win && opened === 0) {
        setQueueState(item.id, "blocked");
        alert("Popup blocked. Allow popups or reduce open settings.");
        return;
      }
      if (win) {
        opened += 1;
        markOpened(item);
        setQueueState(item.id, "open");
      } else {
        setQueueState(item.id, "blocked");
      }
      await sleep(settings.openDelayMs || 80);
    }
    finishQueue();
    saveState();
    render();
  }

  function openWindow(url, index) {
    const width = Math.min(1240, Math.max(760, Math.round(window.screen.availWidth * 0.72)));
    const height = Math.min(920, Math.max(560, Math.round(window.screen.availHeight * 0.78)));
    const offset = index * 28;
    const left = Math.max(0, Math.round((window.screen.availWidth - width) / 2) + offset);
    const top = Math.max(0, Math.round((window.screen.availHeight - height) / 2) + offset);
    const features = [
      "popup=yes",
      `width=${width}`,
      `height=${height}`,
      `left=${left}`,
      `top=${top}`
    ].join(",");

    const opened = window.open(url, `spaces_window_${Date.now()}_${index}`, features);
    try {
      if (opened) opened.opener = null;
    } catch (err) {
      // Some cross-origin windows may not allow opener cleanup.
    }
    return opened;
  }

  function openOne(url, link = null) {
    const safe = safeUrl(url);
    if (!safe) {
      notify("That link is not valid anymore.");
      return;
    }
    const win = window.open(safe, "_blank");
    if (!win) {
      notify("Popup blocked. Allow popups for Spaces.");
      return;
    }
    if (link) {
      markOpened(link);
      saveState();
      render();
    }
  }

  function markOpened(link) {
    if (!link) return;
    link.lastOpened = now();
  }

  function showQueue(folder, links) {
    el.openQueue.dataset.open = "true";
    el.openQueue.innerHTML = `
      <strong>Opening ${escapeHtml(folder.name)}</strong>
      ${links.map((link) => `
        <div class="queueItem" data-link-id="${escapeHtml(link.id)}" data-state="queued">
          <span class="queueDot" aria-hidden="true"></span>
          <span>${escapeHtml(link.title)}</span>
        </div>
      `).join("")}
    `;
  }

  function setQueueState(linkId, stateName) {
    const item = el.openQueue.querySelector(`[data-link-id="${CSS.escape(linkId)}"]`);
    if (item) item.dataset.state = stateName;
  }

  function finishQueue() {
    window.clearTimeout(finishQueue._timer);
    finishQueue._timer = window.setTimeout(() => {
      el.openQueue.dataset.open = "false";
    }, 1800);
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function showImportExport() {
    const wrap = document.createElement("div");
    const data = JSON.stringify(state, null, 2);

    wrap.innerHTML = `
      <div class="tiny">
        Export your setup for backups or new devices. Import replaces your current data.
      </div>
      <div class="hr"></div>
      <label>Export (copy this)</label>
      <textarea id="io_area">${escapeHtml(data)}</textarea>
      <div class="hr"></div>
      <div class="tiny">
        Import: paste JSON above, then click “Import”.
      </div>
    `;

    const btnCopy = mkButton("Copy export", {
      cls: "",
      onClick: async () => {
        const area = wrap.querySelector("#io_area");
        area.select();
        try {
          await navigator.clipboard.writeText(area.value);
          notify("Export copied to clipboard.");
        } catch (err) {
          document.execCommand("copy");
          notify("Export copied.");
        }
      }
    });
    const btnImport = mkButton("Import (replace)", {
      cls: "primary",
      onClick: () => {
        const txt = wrap.querySelector("#io_area").value.trim();
        try {
          const obj = JSON.parse(txt);
          state = normalizeState(obj);
          saveState();
          render();
          closeModal();
          notify("Import complete.");
        } catch (err) {
          alert("Import failed. Paste valid JSON from an export.");
        }
      }
    });

    openModal({ title: "Import / Export", body: wrap, footer: [btnCopy, btnImport] });
    setTimeout(() => wrap.querySelector("#io_area").focus(), 30);
  }

  function showSettings() {
    const settings = normalizeSettings(state.settings || {});

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="form">
        <div>
          <label>Open mode</label>
          <select id="s_mode">
            <option value="tabs">New tabs</option>
            <option value="window">Separate windows</option>
          </select>
        </div>
        <div>
          <label>Confirm “Open all”</label>
          <select id="s_confirm">
            <option value="true">On</option>
            <option value="false">Off</option>
          </select>
        </div>
        <div>
          <label>Safety cap (max tabs)</label>
          <input id="s_cap" type="number" min="1" max="100" value="${settings.maxOpenAll}">
        </div>
        <div>
          <label>Open delay (ms)</label>
          <input id="s_delay" type="number" min="0" max="2000" value="${settings.openDelayMs}">
        </div>
        <div class="full tiny">
          Note: browsers may block popups if you open many links too fast or without a click.
        </div>
      </div>
    `;

    wrap.querySelector("#s_mode").value = settings.openMode;
    wrap.querySelector("#s_confirm").value = String(Boolean(settings.confirmOpenAll));

    const btnSave = mkButton("Save settings", {
      cls: "primary",
      onClick: () => {
        const openMode = wrap.querySelector("#s_mode").value;
        const confirmOpenAll = wrap.querySelector("#s_confirm").value === "true";
        const maxOpenAll = clampInt(wrap.querySelector("#s_cap").value, 1, 100, defaultSettings.maxOpenAll);
        const openDelayMs = clampInt(wrap.querySelector("#s_delay").value, 0, 2000, defaultSettings.openDelayMs);

        state.settings = { openMode, confirmOpenAll, maxOpenAll, openDelayMs };
        saveState();
        closeModal();
        notify("Settings saved.");
      }
    });

    openModal({ title: "Settings", body: wrap, footer: [btnSave] });
  }

  function clampInt(value, min, max, fallback) {
    const number = parseInt(value, 10);
    if (Number.isNaN(number)) return fallback;
    return Math.min(max, Math.max(min, number));
  }

  let drag = { type: null, folderId: null, linkId: null };

  function onFolderDragStart(event, folderId) {
    drag = { type: "folder", folderId, linkId: null };
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", folderId);
  }

  function onFolderDrop(event, targetFolderId) {
    event.preventDefault();
    if (drag.type !== "folder" || drag.folderId === targetFolderId) return;

    const list = [...state.folders].sort(byOrder);
    const from = list.findIndex((folder) => folder.id === drag.folderId);
    const to = list.findIndex((folder) => folder.id === targetFolderId);
    if (from < 0 || to < 0) return;

    const [moved] = list.splice(from, 1);
    list.splice(to, 0, moved);
    list.forEach((folder, index) => {
      folder.order = index;
    });

    state.folders = list;
    saveState();
    render();
  }

  function onLinkDragStart(event, linkId) {
    const folder = activeFolder();
    if (!folder) return;
    drag = { type: "link", folderId: folder.id, linkId };
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", linkId);
  }

  function onLinkDrop(event, targetLinkId) {
    event.preventDefault();
    if (drag.type !== "link" || drag.linkId === targetLinkId) return;

    const folder = activeFolder();
    if (!folder || folder.id !== drag.folderId) return;

    const list = [...(folder.links || [])].sort(byOrder);
    const from = list.findIndex((link) => link.id === drag.linkId);
    const to = list.findIndex((link) => link.id === targetLinkId);
    if (from < 0 || to < 0) return;

    const [moved] = list.splice(from, 1);
    list.splice(to, 0, moved);
    list.forEach((link, index) => {
      link.order = index;
    });
    folder.links = list;

    saveState();
    render();
  }

  function render() {
    normalizeOrders();

    const folders = [...state.folders].sort(byOrder);
    el.folderCount.textContent = String(folders.length);
    el.folderList.innerHTML = "";

    folders.forEach((folder) => {
      const node = document.createElement("div");
      node.className = "folder";
      node.draggable = true;
      node.dataset.active = String(folder.id === state.activeFolderId);
      node.setAttribute("role", "listitem");
      node.addEventListener("click", () => setActiveFolder(folder.id));
      node.addEventListener("dragstart", (event) => onFolderDragStart(event, folder.id));
      node.addEventListener("dragover", (event) => event.preventDefault());
      node.addEventListener("drop", (event) => onFolderDrop(event, folder.id));

      const left = document.createElement("div");
      left.className = "folderLeft";
      left.innerHTML = `
        <div class="emoji">${escapeHtml(folder.emoji || "📁")}</div>
        <div class="folderText">
          <p class="folderName">${escapeHtml(folder.name || "Untitled")}</p>
          <div class="folderMeta">${escapeHtml(spaceHealth(folder))}</div>
        </div>
      `;

      const actions = document.createElement("div");
      actions.className = "folderActions";

      const editBtn = document.createElement("button");
      editBtn.className = "iconBtn";
      editBtn.textContent = "Edit";
      editBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        showFolderModal(folder);
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "iconBtn danger";
      deleteBtn.textContent = "Delete";
      deleteBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        deleteFolder(folder.id);
      });

      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);

      node.appendChild(left);
      node.appendChild(actions);
      el.folderList.appendChild(node);
    });

    const active = activeFolder();
    el.activeFolderName.textContent = active ? active.name : "—";
    el.activeFolderLinks.textContent = String(active ? (active.links || []).length : 0);

    el.btnOpenAll.disabled = !active || !(active.links || []).length;
    el.btnNewLink.disabled = !active;
    el.btnAddTabs.hidden = !tabsApi();
    el.btnAddTabs.disabled = !active;

    el.itemsGrid.innerHTML = "";
    const query = (el.searchInput.value || "").trim().toLowerCase();

    if (!active) {
      el.emptyState.style.display = "block";
      el.emptyState.innerHTML = "Create one space, then add the links that belong there.";
      return;
    }

    const links = (active.links || []).sort(byOrder);
    const filtered = links.filter((link) => {
      if (!query) return true;
      const hay = `${link.title} ${link.url} ${domainOf(link.url)}`.toLowerCase();
      return hay.includes(query);
    });

    if (!filtered.length) {
      el.emptyState.style.display = "block";
      el.emptyState.innerHTML = query
        ? `No results for <span class="kbd">${escapeHtml(query)}</span> in <b>${escapeHtml(active.name)}</b>.`
        : `No links in <b>${escapeHtml(active.name)}</b> yet. Add one link here.`;
    } else {
      el.emptyState.style.display = "none";
    }

    filtered.forEach((link) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.linkId = link.id;
      card.dataset.captured = String(link.id === capturedLinkId);
      card.draggable = true;

      card.addEventListener("dragstart", (event) => onLinkDragStart(event, link.id));
      card.addEventListener("dragover", (event) => event.preventDefault());
      card.addEventListener("drop", (event) => onLinkDrop(event, link.id));

      const tag = domainOf(link.url) || "link";

      card.innerHTML = `
        <div class="cardTop">
          <div style="min-width:0">
            <p class="title">${escapeHtml(link.title)}</p>
            <p class="url">${escapeHtml(link.url)}</p>
          </div>
        </div>
        <div class="tag">${escapeHtml(tag)} · ${escapeHtml(formatLastOpened(link.lastOpened))}</div>
        <div class="cardActions">
          <button class="openAction" data-act="open" type="button">Open</button>
          <button data-act="edit" type="button">Edit</button>
          <button class="danger" data-act="del" type="button">Delete</button>
        </div>
      `;

      card.querySelector('[data-act="open"]').addEventListener("click", () => openOne(link.url, link));
      card.querySelector('[data-act="edit"]').addEventListener("click", () => showLinkModal(link));
      card.querySelector('[data-act="del"]').addEventListener("click", () => deleteLink(link.id));

      el.itemsGrid.appendChild(card);
    });
  }

  el.btnNewFolder.addEventListener("click", () => showFolderModal(null));
  el.btnAddTabs.addEventListener("click", showTabsModal);
  el.btnCapture.addEventListener("click", showCaptureSetup);
  el.btnNewLink.addEventListener("click", () => showLinkModal(null));
  el.btnIO.addEventListener("click", showImportExport);
  el.btnSettings.addEventListener("click", showSettings);

  el.btnOpenAll.addEventListener("click", openAllInFolder);

  el.searchInput.addEventListener("input", render);

  render();
  handleIncomingCapture();
})();

</script>
</body>
</html>
